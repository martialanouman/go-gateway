# Violates, on purpose: deployment-per-service (nine services missing, plus not-a-service below),
# probe-endpoints (liveness on /readyz), probe-timeout (2s), grace-period (30 < 65),
# secrets-by-reference (POSTGRES_URL literal, and the Secret below), required-override (no HTTP_PORT,
# no ENVIRONMENT), known-env-name (POSTGRE_URL), image-convention (nginx),
# pool-covers-lanes twice (minReplicas 2 over 6 partitions is 3 lanes per pod against POSTGRES_MAX_CONNS
# 2; and the not-a-service HPA below omits minReplicas entirely), no-subpath (the subPath mount below —
# the Job further down violates it too, through subPathExpr, which is what pins the Job call site).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api-svc
  labels:
    app: rest-api-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rest-api-svc
  template:
    metadata:
      labels:
        app: rest-api-svc
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rest-api-svc
          image: nginx:latest
          env:
            - name: POSTGRES_URL
              value: postgres://gateway:gateway@db:5432/gateway
            # The HPA below scales this Deployment: 8 pods on the 6 partitions set HERE is one lane
            # per pod and two pods with none. Against config's default of 12 it looks fine.
            - name: KAFKA_TOPIC_PARTITIONS
              value: "6"
            # Two connections for the three partitions the HPA's floor hands one pod. Against config's
            # default of 10 it looks fine, which is the same trap as the partition count above.
            - name: POSTGRES_MAX_CONNS
              value: "2"
            - name: POSTGRE_URL
              value: typo
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway/tls/tls.crt
              subPath: tls.crt
          livenessProbe:
            httpGet:
              path: /readyz
              port: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rest-api-svc
spec:
  selector:
    app: rest-api-svc
  ports:
    - name: ops
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
stringData:
  POSTGRES_URL: postgres://gateway:gateway@db:5432/gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-a-service
  labels:
    app: not-a-service
spec:
  selector:
    matchLabels:
      app: not-a-service
  template:
    metadata:
      labels:
        app: not-a-service
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        # Two containers disagreeing on the drain: the grace period must cover the SLOWEST of them
        # (5 + 300 + 30 = 335 s), not whichever happens to be written last (5 + 10 + 30 = 45 s).
        - name: not-a-service
          image: ghcr.io/martialanouman/go-gateway/not-a-service:v0.0.0
          env:
            - name: ENVIRONMENT
              value: production
            - name: DRAIN_BUDGET
              value: 300s
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            timeoutSeconds: 4
        - name: sidecar
          image: ghcr.io/martialanouman/go-gateway/sidecar:v0.0.0
          env:
            - name: ENVIRONMENT
              value: production
            - name: DRAIN_BUDGET
              value: 10s
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            timeoutSeconds: 4
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rest-api-svc
spec:
  scaleTargetRef:
    kind: Deployment
    name: rest-api-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: External
      external:
        metric:
          name: queue_depth_records
          selector:
            matchLabels:
              queue: mt.inbound
---
# Violates, on purpose: job-container-rules (a literal secret, an unknown variable name, an image off
# the release registry) and no-subpath, through subPathExpr — the Deployment above covers subPath on a
# Deployment, so this one is what pins the Job call site AND the subPathExpr branch. A Job has no ops
# port and exits, so probes and grace period do NOT apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-postgres
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:18-alpine
          env:
            - name: POSTGRES_URL
              value: postgres://gateway:gateway@db:5432/gateway
            - name: POSTGRE_MAX_CONNS
              value: "10"
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway/tls/tls.crt
              subPathExpr: $(POD_NAME).crt
---
# Violates, on purpose: known-env-name (POSTGRE_MAX_CONNS). A shared ConfigMap is where a typo hurts
# most — envFrom hands it to every service at once, and caarlos0/env drops an unknown name in silence.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  ENVIRONMENT: production
  POSTGRE_MAX_CONNS: "10"
---
# Violates, on purpose: hpa-max-replicas (scaleTargetRef names no Deployment in the tree, so the
# partition count backing the ceiling cannot be read at all — silence there would be an blind spot,
# not a pass).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orphan-hpa
spec:
  scaleTargetRef:
    kind: Deployment
    name: gone-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: External
      external:
        metric:
          name: queue_depth_records
          selector:
            matchLabels:
              queue: mt.inbound
---
# An HPA with NO minReplicas. The Kubernetes API defaults it to one pod, which means one pod owns every
# partition — 12 here, since not-a-service overrides neither KAFKA_TOPIC_PARTITIONS nor
# POSTGRES_MAX_CONNS and takes both shared defaults (12 and 10). maxReplicas stays under the partition
# count so this violates pool-covers-lanes and NOTHING ELSE: it is the only case in this tree that
# reaches the nil-minReplicas branch, and without it that branch can be replaced by anything at all.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: not-a-service
spec:
  scaleTargetRef:
    kind: Deployment
    name: not-a-service
  maxReplicas: 3
  metrics:
    - type: External
      external:
        metric:
          name: queue_depth_records
          selector:
            matchLabels:
              queue: mt.inbound
        target:
          type: AverageValue
          averageValue: "10000"
---
# Violates, on purpose, exactly one rule: downward-api-fields. SMPP_POD_ADDR is a literal (an operator
# guessing a pod IP, which is right for at most one replica and wrong the moment it is rescheduled) and
# SMPP_POD_ID reads the wrong fieldPath. Everything else here is deliberately correct, so the rule this
# object pins cannot be confused with another one firing on the same file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smpp-server-svc
  labels:
    app: smpp-server-svc
spec:
  selector:
    matchLabels:
      app: smpp-server-svc
  template:
    # The pod template carries the label the PDB below selects on: without it pdb-per-deployment also
    # fires here, and a future red on this object could not be attributed to one rule.
    metadata:
      labels:
        app: smpp-server-svc
    spec:
      terminationGracePeriodSeconds: 150
      containers:
        - name: smpp-server-svc
          image: ghcr.io/martialanouman/go-gateway/smpp-server-svc:v0.0.0
          env:
            - name: ENVIRONMENT
              value: production
            - name: SMPP_POD_ADDR
              value: 10.42.0.7
            - name: SMPP_POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            timeoutSeconds: 4
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smpp-server-svc
  labels:
    app: smpp-server-svc
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: smpp-server-svc
