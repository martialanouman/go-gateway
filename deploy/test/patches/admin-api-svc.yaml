apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api-svc
spec:
  template:
    spec:
      containers:
        - name: admin-api-svc
          env:
            - name: HTTP_ADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: HTTP_ADMIN_TOKENS
