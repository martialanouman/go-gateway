# Campagne step-287 : rest-api-svc joignable depuis l'injecteur externe. Posé et retiré par run.sh, jamais
# dans deploy/test. Seuls les hôtes de la zone firewalld test-peers le joignent (README §11).
apiVersion: v1
kind: Service
metadata:
  name: rest-api-svc-load
spec:
  type: NodePort
  selector: { app: rest-api-svc }
  ports:
    - { name: https, port: 8080, targetPort: 8080, nodePort: 30880 }
