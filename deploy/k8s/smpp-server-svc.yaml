# smpp-server-svc — SMPP ingress (plan §1.4: 2775) + pod-local Deliver gRPC
#
# Generated by hand and reviewed: internal/deploy holds this file to the invariants the code enforces
# (probes, ops port, grace period, secrets by reference). Run `make manifests` for schema validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smpp-server-svc
  labels:
    app: smpp-server-svc
    app.kubernetes.io/part-of: go-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smpp-server-svc
  template:
    metadata:
      labels:
        app: smpp-server-svc
        app.kubernetes.io/part-of: go-gateway
      annotations:
        # The ops port is scraped off the pod, never through a Service: it is internal and absent from
        # the OpenAPI contracts (plan §1.4).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # DRAIN_DELAY (5 s) + DRAIN_BUDGET (90 s) + DrainTracing flushing the exporter after the
      # supervisor returns (SHUTDOWN_TIMEOUT, 30 s) = 125 s. 150 leaves the margin. Under it the
      # kubelet SIGKILLs mid-drain: redelivered Kafka records, and a session token held for its full
      # 60 s TTL. DRAIN_BUDGET is deliberately above SHUTDOWN_TIMEOUT — one component may spend the
      # whole shutdown window, and smpp-server-svc drains four of them in sequence.
      terminationGracePeriodSeconds: 150
      volumes:
        # No subPath, and defaultMode 0444: see deploy/k8s/tls/README.md.
        - name: tls
          secret:
            secretName: smpp-server-svc-tls
            defaultMode: 0444
      containers:
        - name: smpp-server-svc
          image: ghcr.io/martialanouman/go-gateway/smpp-server-svc:v0.0.0
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: TLS_ENABLED
              value: "true"
            # Deliver pousse une PDU dans le bind d'un client. Sans liste, tout pod y injecte un MO ou un DLR
              # forgé, que l'ESME reçoit comme authentique.
            - name: TLS_ALLOWED_CLIENTS
              value: mo-dlr-router-svc
            - name: SMPP_PORT
              value: "2775"
            - name: GRPC_PORT
              value: "7000"
            # POD_ID identifies the bind slots this pod holds in the session registry. It defaults to
            # the hostname, which is already the pod name — set explicitly so a restarted pod's new
            # identity is visible in logs rather than inferred.
            - name: SMPP_POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Behind an L4 load balancer speaking PROXY protocol. REQUIRE alone does NOT stop IP
            # spoofing — only restricting the trusted CIDRs does, and it closes the port to anything
            # that is not the LB (step-191). Narrow this to the LB's own range.
            - name: SMPP_TRUSTED_PROXY_CIDRS
              value: "10.0.0.0/8"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: ops
              containerPort: 9090
            - name: smpp
              containerPort: 2775
            - name: deliver
              containerPort: 7000
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway/tls
              readOnly: true
          resources:
            # Starting point, not a measurement. The sizing verdict belongs to step-280, on a
            # representative environment; do not extrapolate it from the step-201e figures.
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              memory: 2Gi
          livenessProbe:
            # Liveness is the process, nothing else: /healthz probes no dependency and always answers
            # 200, so a database outage never turns into a crash loop (plan §1.5).
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Readiness is this service's VITAL dependencies, decided in its wiring.go — the manifest
            # has nothing to redeclare here, and everything not to contradict. timeoutSeconds must stay
            # above the 3 s the ops server bounds its own probes with.
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: smpp-server-svc
  labels:
    app: smpp-server-svc
spec:
  type: LoadBalancer
  selector:
    app: smpp-server-svc
  ports:
    - name: smpp
      port: 2775
      targetPort: 2775
---
apiVersion: v1
kind: Service
metadata:
  name: smpp-server-headless
  labels:
    app: smpp-server-svc
spec:
  clusterIP: None
  selector:
    app: smpp-server-svc
  ports:
    - name: deliver
      port: 7000
      targetPort: 7000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smpp-server-svc
  labels:
    app: smpp-server-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smpp-server-svc
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smpp-server-svc
  labels:
    app: smpp-server-svc
spec:
  # One replica at a time. A node drain that evicts them all at once is the failure step-260 exists to
  # prevent: for smpp-server-svc every ESME loses its pod at once and each session token is held for
  # its full 60 s TTL; for connector-pool-svc the connector is left with zero binds to its SMSC.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: smpp-server-svc
