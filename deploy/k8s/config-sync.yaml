# config-sync — control-plane fan-out over Redis pub/sub (no business port)
#
# Generated by hand and reviewed: internal/deploy holds this file to the invariants the code enforces
# (probes, ops port, grace period, secrets by reference). Run `make manifests` for schema validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-sync
  labels:
    app: config-sync
    app.kubernetes.io/part-of: go-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-sync
  template:
    metadata:
      labels:
        app: config-sync
        app.kubernetes.io/part-of: go-gateway
      annotations:
        # The ops port is scraped off the pod, never through a Service: it is internal and absent from
        # the OpenAPI contracts (plan §1.4).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # DRAIN_DELAY (5 s) + the supervisor's drain budget (SHUTDOWN_TIMEOUT, 30 s) + DrainTracing
      # flushing the exporter after it (30 s again) = 65 s. 90 leaves the margin. Under it the kubelet
      # SIGKILLs mid-drain: redelivered Kafka records, and a session token held for its full 60 s TTL.
      terminationGracePeriodSeconds: 90
      containers:
        - name: config-sync
          image: ghcr.io/martialanouman/go-gateway/config-sync:v0.0.0
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: REDIS_URL
          ports:
            - name: ops
              containerPort: 9090
          resources:
            # Starting point, not a measurement. The sizing verdict belongs to step-280, on a
            # representative environment; do not extrapolate it from the step-201e figures.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            # Liveness is the process, nothing else: /healthz probes no dependency and always answers
            # 200, so a database outage never turns into a crash loop (plan §1.5).
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Readiness is this service's VITAL dependencies, decided in its wiring.go — the manifest
            # has nothing to redeclare here, and everything not to contradict. timeoutSeconds must stay
            # above the 3 s the ops server bounds its own probes with.
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: config-sync
  labels:
    app: config-sync
spec:
  # One replica at a time. A node drain that evicts them all at once is the failure step-260 exists to
  # prevent: for smpp-server-svc every ESME loses its pod at once and each session token is held for
  # its full 60 s TTL; for connector-pool-svc the connector is left with zero binds to its SMSC.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: config-sync
