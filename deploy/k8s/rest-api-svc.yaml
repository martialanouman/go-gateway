# rest-api-svc — public REST ingestion (plan §1.4: 8080)
#
# Generated by hand and reviewed: internal/deploy holds this file to the invariants the code enforces
# (probes, ops port, grace period, secrets by reference). Run `make manifests` for schema validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api-svc
  labels:
    app: rest-api-svc
    app.kubernetes.io/part-of: go-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rest-api-svc
  template:
    metadata:
      labels:
        app: rest-api-svc
        app.kubernetes.io/part-of: go-gateway
      annotations:
        # The ops port is scraped off the pod, never through a Service: it is internal and absent from
        # the OpenAPI contracts (plan §1.4).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # DRAIN_DELAY (5 s) + the supervisor's drain budget (SHUTDOWN_TIMEOUT, 30 s) + DrainTracing
      # flushing the exporter after it (30 s again) = 65 s. 90 leaves the margin. Under it the kubelet
      # SIGKILLs mid-drain: redelivered Kafka records, and a session token held for its full 60 s TTL.
      terminationGracePeriodSeconds: 90
      containers:
        - name: rest-api-svc
          image: ghcr.io/martialanouman/go-gateway/rest-api-svc:v0.0.0
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            # HTTP_PORT defaults to 8081, which is admin-api-svc's: without this override the public
            # API would serve on the internal port (plan §1.4).
            - name: HTTP_PORT
              value: "8080"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: ops
              containerPort: 9090
            - name: http
              containerPort: 8080
          resources:
            # Starting point, not a measurement. The sizing verdict belongs to step-280, on a
            # representative environment; do not extrapolate it from the step-201e figures.
            requests:
              cpu: 1
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            # Liveness is the process, nothing else: /healthz probes no dependency and always answers
            # 200, so a database outage never turns into a crash loop (plan §1.5).
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Readiness is this service's VITAL dependencies, decided in its wiring.go — the manifest
            # has nothing to redeclare here, and everything not to contradict. timeoutSeconds must stay
            # above the 3 s the ops server bounds its own probes with.
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rest-api-svc
  labels:
    app: rest-api-svc
spec:
  selector:
    app: rest-api-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rest-api-svc
  labels:
    app: rest-api-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rest-api-svc
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rest-api-svc
  labels:
    app: rest-api-svc
spec:
  # One replica at a time. A node drain that evicts them all at once is the failure step-260 exists to
  # prevent: for smpp-server-svc every ESME loses its pod at once and each session token is held for
  # its full 60 s TTL; for connector-pool-svc the connector is left with zero binds to its SMSC.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: rest-api-svc
