# connector-pool-svc — outbound SMPP, ONE CONNECTOR PER POD
#
# Generated by hand and reviewed: internal/deploy holds this file to the invariants the code enforces
# (probes, ops port, grace period, secrets by reference). Run `make manifests` for schema validation.
#
# This file is an INSTANCE TEMPLATE. One connector per pod (cmd/connector-pool-svc/wiring.go), each
# with its own consumer group `connector-pool-svc-<CONNECTOR_ID>`: copy it per connector, renaming the
# Deployment `connector-pool-svc-<connector>` and setting CONNECTOR_ID and CONNECTOR_ADDR. Keep
# replicas equal to the connector's bind_pool_size — mt.routed is sharded one partition per bind.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-pool-svc
  labels:
    app: connector-pool-svc
    app.kubernetes.io/part-of: go-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: connector-pool-svc
  template:
    metadata:
      labels:
        app: connector-pool-svc
        app.kubernetes.io/part-of: go-gateway
      annotations:
        # The ops port is scraped off the pod, never through a Service: it is internal and absent from
        # the OpenAPI contracts (plan §1.4).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # DRAIN_DELAY (5 s) + DRAIN_BUDGET (90 s) + DrainTracing flushing the exporter after the
      # supervisor returns (SHUTDOWN_TIMEOUT, 30 s) = 125 s. 150 leaves the margin. Under it the
      # kubelet SIGKILLs mid-drain: redelivered Kafka records, and a session token held for its full
      # 60 s TTL. DRAIN_BUDGET is deliberately above SHUTDOWN_TIMEOUT — one component may spend the
      # whole shutdown window, and smpp-server-svc drains four of them in sequence.
      terminationGracePeriodSeconds: 150
      volumes:
        # No subPath, and defaultMode 0444: see deploy/k8s/tls/README.md.
        - name: tls
          secret:
            secretName: connector-pool-svc-tls
            defaultMode: 0444
      containers:
        - name: connector-pool-svc
          image: ghcr.io/martialanouman/go-gateway/connector-pool-svc:v0.0.0
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: TLS_ENABLED
              value: "true"
            - name: CONNECTOR_ID
              value: "00000000-0000-0000-0000-000000000001"
            - name: CONNECTOR_ADDR
              value: "smsc.example.net:2775"
            - name: CONNECTOR_BIND_POOL_SIZE
              value: "2"
            - name: CONNECTOR_AUTO_RECONNECT
              value: "true"
            - name: CONNECTOR_SYSTEM_ID
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CONNECTOR_SYSTEM_ID
            - name: CONNECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CONNECTOR_PASSWORD
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: ops
              containerPort: 9090
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway/tls
              readOnly: true
          resources:
            # Starting point, not a measurement. The sizing verdict belongs to step-280, on a
            # representative environment; do not extrapolate it from the step-201e figures.
            requests:
              cpu: 1
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            # Liveness is the process, nothing else: /healthz probes no dependency and always answers
            # 200, so a database outage never turns into a crash loop (plan §1.5).
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Readiness is this service's VITAL dependencies, decided in its wiring.go — the manifest
            # has nothing to redeclare here, and everything not to contradict. timeoutSeconds must stay
            # above the 3 s the ops server bounds its own probes with.
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: connector-pool-svc
  labels:
    app: connector-pool-svc
spec:
  # mt.routed is partitioned per connector (KAFKA_TOPIC_PARTITIONS_OVERRIDES), not by the shared
  # default, so keep maxReplicas at or below this connector's bind_pool_size: a pod without a bind of
  # its own is a pod that stays not-ready.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: connector-pool-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric:
          name: queue_depth_records
          selector:
            matchLabels:
              queue: mt.routed
        target:
          type: AverageValue
          averageValue: "5000"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: connector-pool-svc
  labels:
    app: connector-pool-svc
spec:
  # One replica at a time. A node drain that evicts them all at once is the failure step-260 exists to
  # prevent: for smpp-server-svc every ESME loses its pod at once and each session token is held for
  # its full 60 s TTL; for connector-pool-svc the connector is left with zero binds to its SMSC.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: connector-pool-svc
