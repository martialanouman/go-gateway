# The CDR schema. One statement per migration file — the splitter breaks on a ';' inside a comment.
#
# CLICKHOUSE_PASSWORD has no usable default in production: every binary declaring the ClickHouse
# section refuses to boot on it, this Job included (step-260f).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-clickhouse
  labels:
    app.kubernetes.io/part-of: go-gateway
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: go-gateway
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/martialanouman/go-gateway/migrate:v0.0.0
          args: ["-store", "clickhouse", "up"]
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CLICKHOUSE_PASSWORD
