# router-svc — the MT pipeline (Kafka consumer, no business port)
#
# Generated by hand and reviewed: internal/deploy holds this file to the invariants the code enforces
# (probes, ops port, grace period, secrets by reference). Run `make manifests` for schema validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-svc
  labels:
    app: router-svc
    app.kubernetes.io/part-of: go-gateway
spec:
  replicas: 4
  selector:
    matchLabels:
      app: router-svc
  template:
    metadata:
      labels:
        app: router-svc
        app.kubernetes.io/part-of: go-gateway
      annotations:
        # The ops port is scraped off the pod, never through a Service: it is internal and absent from
        # the OpenAPI contracts (plan §1.4).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # DRAIN_DELAY (5 s) + DRAIN_BUDGET (90 s) + DrainTracing flushing the exporter after the
      # supervisor returns (SHUTDOWN_TIMEOUT, 30 s) = 125 s. 150 leaves the margin. Under it the
      # kubelet SIGKILLs mid-drain: redelivered Kafka records, and a session token held for its full
      # 60 s TTL. DRAIN_BUDGET is deliberately above SHUTDOWN_TIMEOUT — one component may spend the
      # whole shutdown window, and smpp-server-svc drains four of them in sequence.
      terminationGracePeriodSeconds: 150
      volumes:
        # No subPath: the kubelet updates a Secret volume by swapping a symlink, which a subPath mount
        # never follows — the rotation would silently stop reaching the process. internal/deploy refuses
        # it. 0444 and not 0400: the files belong to uid 0 while the image runs USER 65532, and nothing
        # here sets an fsGroup.
        - name: tls
          secret:
            secretName: router-svc-tls
            defaultMode: 0444
      containers:
        - name: router-svc
          image: ghcr.io/martialanouman/go-gateway/router-svc:v0.0.0
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: TLS_ENABLED
              value: "true"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: ops
              containerPort: 9090
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway/tls
              readOnly: true
          resources:
            # Starting point, not a measurement. The sizing verdict belongs to step-280, on a
            # representative environment; do not extrapolate it from the step-201e figures.
            requests:
              cpu: 2
              memory: 1Gi
            limits:
              memory: 2Gi
          livenessProbe:
            # Liveness is the process, nothing else: /healthz probes no dependency and always answers
            # 200, so a database outage never turns into a crash loop (plan §1.5).
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Readiness is this service's VITAL dependencies, decided in its wiring.go — the manifest
            # has nothing to redeclare here, and everything not to contradict. timeoutSeconds must stay
            # above the 3 s the ops server bounds its own probes with.
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: router-svc
  labels:
    app: router-svc
spec:
  # maxReplicas must stay UNDER the partition count of mt.inbound (KAFKA_TOPIC_PARTITIONS, 12). The
  # router opens one goroutine per partition ASSIGNED TO ITS POD (step-201d): at one pod per partition
  # every pod is down to a single lane, so the fan-out disappears exactly when the load calls for it
  # and the HPA keeps growing without buying anything (ADR-0014). The measured figure belongs to
  # step-280 — 8 is a ceiling that preserves the property, not a sizing.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: router-svc
  minReplicas: 4
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: queue_depth_records
          selector:
            matchLabels:
              queue: mt.inbound
        target:
          type: AverageValue
          averageValue: "10000"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: router-svc
  labels:
    app: router-svc
spec:
  # One replica at a time. A node drain that evicts them all at once is the failure step-260 exists to
  # prevent: for smpp-server-svc every ESME loses its pod at once and each session token is held for
  # its full 60 s TTL; for connector-pool-svc the connector is left with zero binds to its SMSC.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: router-svc
