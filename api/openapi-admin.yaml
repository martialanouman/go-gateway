      operationId: create-rate-plan
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RatePlanCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RatePlan' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/rate-plans/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Rate Plans]
      summary: Update a rate plan
      operationId: update-rate-plan
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RatePlanUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RatePlan' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Rate Plans]
      summary: Delete a rate plan
      operationId: delete-rate-plan
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/billing-providers:
    get:
      tags: [Billing Providers]
      summary: List external billing providers
      operationId: list-billing-providers
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExternalBillingProvider' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Billing Providers]
      summary: Create an external billing provider
      operationId: create-billing-provider
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalBillingProviderCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalBillingProvider' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/billing-providers/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Billing Providers]
      summary: Update an external billing provider
      operationId: update-billing-provider
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalBillingProviderUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalBillingProvider' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Billing Providers]
      summary: Delete an external billing provider
      operationId: delete-billing-provider
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/billing-providers/{id}/test-connection:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Billing Providers]
      summary: Test connectivity to the provider
      operationId: test-billing-provider
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, latency_ms: { type: [integer, "null"] }, detail: { type: [string, "null"] } }, required: [ok] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ CONTENT & RGPD (§6.14/§6.23) ============================
  /admin/platform/content-policy:
    get:
      tags: [Content & RGPD]
      summary: Get platform default content policy
      operationId: get-platform-content-policy
      description: >-
        The policy an `inherit` customer resolves to. `off` until changed. `content_retention_days` is the
        body retention the CDR applies (a ClickHouse column TTL, 30 days).
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Content & RGPD]
      summary: Update platform default content policy
      operationId: update-platform-content-policy
      description: >-
        `content_storage` is `off` or `stored_encrypted`; `inherit` and `stored_plaintext` are refused with
        422 — storage in clear belongs to a named customer under contract, never to every customer that has
        not chosen. `content_retention_days` cannot be changed here (422 unless absent or equal to the
        current value): it is a ClickHouse column TTL, altered as an operations task. The new default
        reaches the data plane on its next configuration reload, without a restart.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/customers/{id}/content-policy:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Content & RGPD]
      summary: Get a customer's content policy
      operationId: get-customer-content-policy
      description: >-
        The customer's own setting, `inherit` included — not the resolved policy. `content_retention_days`
        is stored but not yet applied: every body expires with the platform retention.
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Content & RGPD]
      summary: Update a customer's content policy
      operationId: update-customer-content-policy
      description: >-
        Writes the same columns as update-customer, but `content_storage` is required here. The change reaches
        the data plane on its next configuration reload, without a restart. `content_retention_days` is
        stored but not yet applied, and a `null` leaves it unchanged.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/messages/{id}/content:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Content & RGPD]
      summary: Decrypt and return a message body (scope content:read, audited)
      operationId: get-message-content
      security: [ { OperatorBearer: [content:read] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageContent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/customers/{id}/content/erase:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Content & RGPD]
      summary: Content-only crypto-shred (scope content:erase)
      operationId: erase-customer-content
      security: [ { OperatorBearer: [content:erase] } ]
      responses:
        '202': { description: Accepted., content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/customers/{id}/content/rotate-key:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Content & RGPD]
      summary: Rotate the customer's content encryption key
      operationId: rotate-content-key
      security: [ { OperatorBearer: [admin:write] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentKey' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/gdpr/erase:
    post:
      tags: [Content & RGPD]
      summary: On-demand RGPD erasure (scope gdpr:erase, async, irreversible)
      operationId: gdpr-erase
      security: [ { OperatorBearer: [gdpr:erase] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { subject_type: { type: string, enum: [customer, msisdn] }, id: { type: string, description: 'Customer UUID or MSISDN depending on subject_type.' } }, required: [subject_type, id] } } } }
      responses:
        '202': { description: Accepted., content: { application/json: { schema: { $ref: '#/components/schemas/GdprEraseJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/gdpr/erase/{jobId}:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Content & RGPD]
      summary: RGPD erase job status + attestation
      operationId: get-gdpr-erase-job
      security: [ { OperatorBearer: [gdpr:erase] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GdprEraseJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ MESSAGES: TRACE / SEARCH / EXPORT ============================
  /admin/messages/{id}/trace:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Messages]
      summary: Span timeline for a message (never carries the body)
      operationId: get-message-trace
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageTrace' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/messages/search:
    get:
      tags: [Messages]
      summary: Search CDR (by traceId, account, customer, group, status, ...)
      description: >-
        Every predicate combines with AND — an extra filter can only narrow a result set. The date
        window is REQUIRED and capped at 31 days: it is what lets the CDR's daily partitions be
        pruned, so an unbounded search cannot be expressed. MSISDNs are masked in the response unless
        the caller holds msisdn:reveal. No message body is ever returned.
      operationId: search-messages
      parameters:
        - { name: traceId, in: query, schema: { type: string, format: uuid } }
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - name: groupId
          in: query
          description: Customers CURRENTLY in this group; membership is resolved at read time.
          schema: { type: string, format: uuid }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CdrStatus' } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/Direction' } }
        - name: msisdn
          in: query
          description: Exact E.164 match on either address. Never a prefix — that would allow enumeration.
          schema: { type: string }
        - { name: from_date, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to_date, in: query, required: true, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageSummaryPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/messages/export:
    post:
      tags: [Messages]
      summary: Create an async CDR export job (row-capped, role-based MSISDN mask)
      description: >-
        Queues an export and returns immediately: the artefact is produced in the background. The
        filters are those of search-messages, with the same mandatory 31-day window, and the export
        is capped at 100000 rows — beyond it the job FAILS rather than truncating silently, because
        a truncated export reads as an exhaustive one. Unmasking (mask_msisdn=false) requires
        msisdn:reveal. No message body is ever exported.
      operationId: create-message-export
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageExportRequest' } } } }
      security: [ { OperatorBearer: [ cdr:export_bulk ] } ]
      responses:
        '202': { description: Accepted., content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Export storage is not configured in this deployment., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/messages/export/{jobId}:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Messages]
      summary: Export job status + download URL when ready
      description: Requires cdr:export_bulk like the creation — the status carries the artefact's location.
      operationId: get-message-export
      security: [ { OperatorBearer: [ cdr:export_bulk ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ METRICS & REALTIME ============================
  /admin/metrics/summary:
    get:
      tags: [Metrics]
      summary: Rolling summary counters
      description: >-
        Counts the messages SUBMITTED within the window (a cohort on submitted_at), each with its status at
        the time of the read: on a short window, delivered undercounts what is still in flight. Only 5m and
        1h are served; any other window is refused with 422 (24h awaits a pre-aggregate). delivered and
        failed follow the same status precedence as search-messages.
      operationId: get-metrics-summary
      security: [ { OperatorBearer: [ admin:read ] } ]
      parameters: [ { name: window, in: query, description: 'One of 5m, 1h.', schema: { type: string, default: 5m, examples: [5m, 1h] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MetricsSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/metrics/traffic:
    get:
      tags: [Metrics]
      summary: Traffic time series grouped by dimension
      description: >-
        MT messages submitted within the window, bucketed every 10s (5m) or every minute (1h), with the same
        cohort semantics as get-metrics-summary. Only 5m and 1h are served; any other window is refused with
        422. The 20 keys with the most submissions get their own series, the rest is summed under the key
        `other`. By group, the membership is the CURRENT one and customers outside any group fall under
        `ungrouped`. By connector, a message never dispatched has no connector and appears in no series.
        503 when the window holds more rows than a read may return.
      operationId: get-traffic-metrics
      security: [ { OperatorBearer: [ admin:read ] } ]
      parameters:
        - { name: groupBy, in: query, schema: { type: string, enum: [connector, customer, group], default: connector } }
        - { name: window, in: query, description: 'One of 5m, 1h.', schema: { type: string, default: 1h } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficMetrics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/stream/metrics:
    get:
      tags: [Realtime]
      summary: WebSocket — live metrics stream
      description: >-
        Upgrade to a WebSocket. Emits one metricstream Snapshot per frame
        (`{v, feed, service, instance, emitted_at, samples[]}`); branch on `v`. `101 Switching Protocols` on upgrade.
      operationId: stream-metrics
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '101': { description: Switching Protocols (WebSocket). }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/stream/sessions:
    get:
      tags: [Realtime]
      summary: WebSocket — live session events
      description: >-
        Upgrade to a WebSocket. Emits one metricstream SessionEvent per frame
        (`{v, feed, account_id, system_id, state, sessions}`). `101 Switching Protocols` on upgrade.
      operationId: stream-sessions
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '101': { description: Switching Protocols (WebSocket). }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/stream/billing-alerts:
    get:
      tags: [Realtime]
      summary: WebSocket — MO floor-reached alerts
      description: >-
        Upgrade to a WebSocket. Emits one metricstream BillingAlert per frame
        (`{v, feed, customer_id, owner_type, owner_id, alert, balance}`). Only `mo_floor_reached` is emitted
        today; low-balance and breaker-open alerts have no configured threshold yet. `101 Switching
        Protocols` on upgrade.
      operationId: stream-billing-alerts
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '101': { description: Switching Protocols (WebSocket). }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    OperatorBearer:
      type: oauth2
      description: |
        Operator bearer token (JWT). Scopes gate sensitive operations: `content:read`, `content:erase`,
        `gdpr:erase`, plus coarse `admin:read` / `admin:write`. The transport is additionally protected
        by mTLS on the internal network.
      flows:
        clientCredentials:
          tokenUrl: https://admin.gateway.internal/oauth/token
          scopes:
            admin:read: Read control-plane resources.
            admin:write: Mutate control-plane resources.
            content:read: Decrypt and read message bodies.
            content:erase: Crypto-shred customer content.
            gdpr:erase: Execute RGPD erasure.
            msisdn:reveal: See subscriber numbers unmasked (search, trace and export mask them otherwise).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SenderId:
      name: senderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredId:
      name: credId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Status:
      name: status
      in: query
      required: false
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

  responses:
    Unauthorized:
      description: Missing or invalid operator token.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but missing the required scope.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicting state (e.g. non-zero balances, duplicate active script/credential).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Semantic validation failed; see errors[].
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: A dependency (e.g. billing-svc) is unreachable or timed out; retry once it recovers.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:

    # ---- shared ----
    Error:
      type: object
      description: |
        Flat error model (application/json). `code` is the stable machine-readable error code — the
        cross-protocol contract also carried by SMPP command_status (engineering guide §11). `message`
        is human-readable. `errors[]` carries per-field detail on validation failures. The numeric HTTP
        status is on the status line, not duplicated in the body.
      properties:
        code:
          type: string
          description: |
            Stable machine-readable error code. The enum is every catalogue code with an HTTP
            surface (engineering guide §11.3); codes without one — max_sessions_exceeded (SMPP bind
            only) and the outbound outcomes recorded in a message's error_code — never appear here.
          enum:
            - account_suspended
            - cancel_failed
            - channel_disabled
            - conflict
            - content_blocked
            - external_billing_unavailable
            - forbidden_scope
            - idempotency_conflict
            - insufficient_credit
            - internal_error
            - invalid_destination
            - invalid_source
            - message_not_found
            - no_route
            - not_found
            - operation_not_supported
            - payload_too_large
            - queue_full
            - rate_limited
            - recipient_opted_out
            - sender_id_not_authorized
            - service_unavailable
            - unauthenticated
            - validation_error
          examples: [forbidden_scope, conflict, validation_error, message_not_found, insufficient_credit]
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
            required: [field, message]
      required: [code, message]
    AsyncJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        detail: { type: [string, "null"] }
      required: [job_id, status, created_at]
    PageMeta:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
      required: [has_more]

    # ---- enums (aligned with the DDL) ----
    Direction: { type: string, enum: [mt, mo] }
    BalanceScope: { type: string, enum: [customer, smpp_account] }
    SenderIdPolicy: { type: string, enum: [strict, allow_unregistered_numeric, disabled] }
    ContentStorage: { type: string, enum: [inherit, off, stored_plaintext, stored_encrypted] }
    DistributionStrategy: { type: string, enum: [static, round_robin, weighted, failover_priority, least_loaded, hash_based] }
    BindType: { type: string, enum: [tx, rx, trx] }
    LinkStatus: { type: string, enum: [up, reconnecting, down] }
    BreakerState: { type: string, enum: [closed, open, half_open] }
    ScriptScope: { type: string, enum: [platform, customer, smpp_account] }
    RewriteScope: { type: string, enum: [platform, customer, smpp_account, connector] }
    SuppressionScope: { type: string, enum: [inbound_number, smpp_account, customer, platform] }
    SuppressionSource: { type: string, enum: [mo_stop, admin, import, carrier, regulator] }
    # The eight the cdr table's own enum writes. accepted (the pre-dispatch row, §1.10) and cancelled
    # (M3) were missing: search-messages returns them on every freshly accepted message, so a narrower
    # enum here made the contract under-declare what the API already serves.
    CdrStatus: { type: string, enum: [accepted, enroute, delivered, failed, expired, rejected, rerouted, cancelled] }

    # ---- customer groups ----
    CustomerGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, status, created_at, updated_at]
    CustomerGroupCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
      required: [name]
    CustomerGroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, description: 'Omit to leave the name unchanged; the empty string is not a way to clear it.' }
        description: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }

    # ---- customers ----
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended, closed] }
        group_id: { type: [string, "null"], format: uuid }
        rate_plan_id: { type: [string, "null"], format: uuid }
        billing_enabled: { type: boolean }
        billing_mode: { type: [string, "null"], enum: [prepaid, postpaid, null] }
        overdraft_enabled: { type: boolean }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean }
        balance_scope: { $ref: '#/components/schemas/BalanceScope' }
        mo_billing_floor: { type: [integer, "null"] }
        content_storage: { $ref: '#/components/schemas/ContentStorage' }
        content_retention_days: { type: [integer, "null"], minimum: 0 }
        content_key_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, status, billing_enabled, balance_scope, content_storage, created_at, updated_at]
    CustomerCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        group_id: { type: [string, "null"], format: uuid }
        rate_plan_id: { type: [string, "null"], format: uuid }
        billing_enabled: { type: boolean, default: false }
        billing_mode: { type: [string, "null"], enum: [prepaid, postpaid, null] }
        overdraft_enabled: { type: boolean, default: false }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean, default: false }
        balance_scope: { $ref: '#/components/schemas/BalanceScope' }
        mo_billing_floor: { type: [integer, "null"] }
        content_storage: { $ref: '#/components/schemas/ContentStorage' }
        content_retention_days: { type: [integer, "null"], minimum: 0 }
      required: [name]
    CustomerUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended, closed] }
        rate_plan_id: { type: [string, "null"], format: uuid }
        billing_enabled: { type: boolean }
        billing_mode: { type: [string, "null"], enum: [prepaid, postpaid, null] }
        overdraft_enabled: { type: boolean }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean }
        mo_billing_floor: { type: [integer, "null"] }
        content_storage: { $ref: '#/components/schemas/ContentStorage' }
        content_retention_days: { type: [integer, "null"], minimum: 0 }

    CustomerPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
          required: [data]

    # ---- sender ids ----
    SenderId:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        address: { type: string }
        status: { type: string, enum: [pending_carrier_approval, active, disabled] }
        created_by: { type: [string, "null"], format: uuid }
        approved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, customer_id, address, status, created_at, updated_at]
    SenderIdCreate:
      type: object
      additionalProperties: false
      properties:
        address: { type: string, maxLength: 20 }
      required: [address]
    SenderIdUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending_carrier_approval, active, disabled] }

    # ---- smpp accounts ----
    SmppAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended, closed] }
        smpp_enabled: { type: boolean }
        rest_enabled: { type: boolean }
        sender_id_policy: { $ref: '#/components/schemas/SenderIdPolicy' }
        query_sm_enabled: { type: boolean }
        cancel_sm_enabled: { type: boolean }
        allowed_bind_types: { $ref: '#/components/schemas/BindType' }
        max_sessions: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, customer_id, name, status, smpp_enabled, rest_enabled, sender_id_policy, allowed_bind_types, max_sessions, created_at, updated_at]
    SmppAccountCreate:
      type: object
      additionalProperties: false
      properties:
        customer_id: { type: string, format: uuid }
        name: { type: string }
        smpp_enabled: { type: boolean, default: true }
        rest_enabled: { type: boolean, default: true }
        sender_id_policy: { $ref: '#/components/schemas/SenderIdPolicy' }
        query_sm_enabled: { type: boolean, default: true }
        cancel_sm_enabled: { type: boolean, default: true }
        allowed_bind_types: { $ref: '#/components/schemas/BindType' }
        max_sessions: { type: integer, minimum: 0, default: 1 }
      required: [customer_id, name]
    SmppAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended, closed] }
    ChannelsUpdate:
      type: object
      additionalProperties: false
      description: At least one channel must remain true.
      properties:
        smpp_enabled: { type: boolean }
        rest_enabled: { type: boolean }
      required: [smpp_enabled, rest_enabled]
    SessionLimitsUpdate:
      type: object
      additionalProperties: false
      properties:
        max_sessions: { type: integer, minimum: 0 }
        allowed_bind_types: { $ref: '#/components/schemas/BindType' }
      required: [max_sessions, allowed_bind_types]
    SmppAccountPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/SmppAccount' } }
          required: [data]

    # ---- webhooks (per account) ----
    Webhook:
      type: object
      description: Per-account MO/DLR webhook. `secret` is write-only and never returned.
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        event_type: { type: string, enum: [mo, dlr] }
        url: { type: string, format: uri }
        retry_policy_json: { type: object, additionalProperties: true, description: 'Retry bounds. Only max_attempts applies to deferred retries; the back-off fields pace the in-band sender, which the deferred retry path replaces in production.' }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, account_id, event_type, url, status]
    WebhookCreate:
      type: object
      additionalProperties: false
      properties:
        event_type: { type: string, enum: [mo, dlr] }
        url: { type: string, format: uri, pattern: '^https?://[^/]' }
        secret: { type: string, minLength: 16, description: Write-only HMAC-SHA256 signing secret. }
        retry_policy_json: { type: object, additionalProperties: true, description: 'Retry bounds. Only max_attempts applies to deferred retries; the back-off fields pace the in-band sender, which the deferred retry path replaces in production.' }
      required: [event_type, url, secret]
    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, pattern: '^https?://[^/]' }
        secret: { type: string, minLength: 16, description: Write-only; rotates the signing secret. }
        retry_policy_json: { type: object, additionalProperties: true, description: 'Retry bounds. Only max_attempts applies to deferred retries; the back-off fields pace the in-band sender, which the deferred retry path replaces in production.' }
        status: { type: string, enum: [active, disabled] }

    # ---- credentials ----
    Credential:
      type: object
      description: Masked view — never carries a secret.
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [smpp_bind, api_key] }
        system_id: { type: [string, "null"], description: Set for smpp_bind. }
        status: { type: string, enum: [active, disabled, revoked] }
        last_used_at: { type: [string, "null"], format: date-time }
        grace_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, "null"], format: date-time }
      required: [id, account_id, type, status, created_at]
    CredentialWithSecret:
      type: object
      description: Returned ONCE at creation/rotation. The secret is never retrievable again.
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          properties:
            secret: { type: string, description: The plaintext SMPP password or API key — shown once. }
          required: [secret]

    # ---- connectors ----
    Connector:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        bind_type: { $ref: '#/components/schemas/BindType' }
        system_id: { type: string }
        vendor_profile: { type: [string, "null"] }
        system_type: { type: string }
        interface_version: { type: integer, description: '52 = SMPP v3.4 (0x34), 80 = v5.0 (0x50).' }
        addr_ton: { type: integer }
        addr_npi: { type: integer }
        address_range: { type: string }
        source_addr_ton: { type: integer }
        source_addr_npi: { type: integer }
        dest_addr_ton: { type: integer }
        dest_addr_npi: { type: integer }
        data_coding_default: { type: [integer, "null"] }
        registered_delivery_default: { type: integer }
        replace_if_present_flag_default: { type: integer }
        esm_class_default: { type: integer }
        priority_flag_default: { type: integer }
        validity_period_default: { type: [string, "null"] }
        sm_default_msg_id: { type: integer }
        enquire_link_interval_sec: { type: integer, minimum: 1 }
        enquire_link_max_missed: { type: integer, minimum: 1 }
        bind_timeout_ms: { type: integer, minimum: 1 }
        response_timeout_ms: { type: integer, minimum: 1 }
        window_size: { type: integer, minimum: 1 }
        bind_pool_size: { type: integer, minimum: 1, maximum: 32 }
        throughput_limit_per_sec: { type: [integer, "null"], minimum: 1 }
        tls_enabled: { type: boolean }
        tls_config_json: { type: [object, "null"], additionalProperties: true }
        priority_tier: { type: integer }
        status: { type: string, enum: [active, degraded, disabled] }
        auto_reconnect_enabled: { type: boolean }
        reconnect_initial_delay_ms: { type: integer, minimum: 1 }
        reconnect_multiplier: { type: number, minimum: 1.0, maximum: 99.99 }
        reconnect_max_delay_ms: { type: integer, minimum: 1 }
        reconnect_jitter_pct: { type: integer, minimum: 0, maximum: 100 }
        reconnect_max_attempts: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, host, port, bind_type, system_id, bind_pool_size, window_size, status, auto_reconnect_enabled]
    ConnectorCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        bind_type: { $ref: '#/components/schemas/BindType' }
        system_id: { type: string }
        password: { type: string, minLength: 1, description: "Write-only; stored sealed, never returned." }
        vendor_profile: { type: [string, "null"] }
        interface_version: { type: integer, default: 52 }
        data_coding_default: { type: [integer, "null"] }
        window_size: { type: integer, minimum: 1, default: 10 }
        bind_pool_size: { type: integer, minimum: 1, maximum: 32, default: 1 }
        throughput_limit_per_sec: { type: [integer, "null"], minimum: 1 }
        tls_enabled: { type: boolean, default: false }
        tls_config_json: { type: [object, "null"], additionalProperties: true }
        priority_tier: { type: integer, default: 0 }
        auto_reconnect_enabled: { type: boolean, default: false }
      required: [name, host, port, bind_type, system_id, password]
    ConnectorUpdate:
      type: object
      additionalProperties: false
      description: Any connector field may be updated except id. `password` is write-only.
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        bind_type: { $ref: '#/components/schemas/BindType' }
        system_id: { type: string }
        password: { type: string, minLength: 1 }
        vendor_profile: { type: [string, "null"] }
        data_coding_default: { type: [integer, "null"] }
        window_size: { type: integer, minimum: 1 }
        throughput_limit_per_sec: { type: [integer, "null"], minimum: 1 }
        tls_enabled: { type: boolean }
        tls_config_json: { type: [object, "null"], additionalProperties: true }
        priority_tier: { type: integer }
        status: { type: string, enum: [active, degraded, disabled] }
    ReconnectPolicy:
      type: object
      additionalProperties: false
      properties:
        auto_reconnect_enabled: { type: boolean }
        reconnect_initial_delay_ms: { type: integer, minimum: 1 }
        reconnect_multiplier: { type: number, minimum: 1.0, maximum: 99.99 }
        reconnect_max_delay_ms: { type: integer, minimum: 1 }
        reconnect_jitter_pct: { type: integer, minimum: 0, maximum: 100 }
        reconnect_max_attempts: { type: integer, minimum: 0 }
      required: [auto_reconnect_enabled]
    ConnectorStatus:
      type: object
      description: Runtime health. link_status and breaker_state are DISTINCT and never conflated (§6.13).
      properties:
        connector_id: { type: string, format: uuid }
        breaker_state: { $ref: '#/components/schemas/BreakerState' }
        binds:
          type: array
          items:
            type: object
            properties:
              bind_index: { type: integer }
              pod_id: { type: string }
              link_status: { $ref: '#/components/schemas/LinkStatus' }
              breaker_state: { $ref: '#/components/schemas/BreakerState' }
              in_flight: { type: integer }
            required: [bind_index, link_status, breaker_state]
      required: [connector_id, breaker_state, binds]

    # ---- routes ----
    Route:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priority: { type: integer }
        match_account_id: { type: [string, "null"], format: uuid }
        match_customer_id: { type: [string, "null"], format: uuid }
        match_sender_pattern: { type: [string, "null"] }
        match_dest_pattern: { type: [string, "null"] }
        match_content_pattern: { type: [string, "null"] }
        distribution_strategy: { $ref: '#/components/schemas/DistributionStrategy' }
        target_connector_id: { type: [string, "null"], format: uuid }
        fallback_route_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, disabled] }
        targets:
          type: array
          description: Present when distribution_strategy != static (>= 2 targets).
          items: { $ref: '#/components/schemas/RouteTarget' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, priority, distribution_strategy, status, created_at, updated_at]
    RouteTarget:
      type: object
      properties:
        connector_id: { type: string, format: uuid }
        weight: { type: integer, minimum: 1 }
        priority: { type: integer }
      required: [connector_id]
    RouteCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        priority: { type: integer, default: 100 }
        match_account_id: { type: [string, "null"], format: uuid }
        match_customer_id: { type: [string, "null"], format: uuid }
        match_sender_pattern: { type: [string, "null"] }
        match_dest_pattern: { type: [string, "null"] }
        match_content_pattern: { type: [string, "null"] }
        distribution_strategy: { $ref: '#/components/schemas/DistributionStrategy' }
        target_connector_id: { type: [string, "null"], format: uuid, description: Required when strategy = static. }
        fallback_route_id: { type: [string, "null"], format: uuid }
        targets: { type: array, items: { $ref: '#/components/schemas/RouteTarget' } }
      required: [name, distribution_strategy]
    RouteUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        priority: { type: integer }
        match_account_id: { type: [string, "null"], format: uuid }
        match_customer_id: { type: [string, "null"], format: uuid }
        match_sender_pattern: { type: [string, "null"] }
        match_dest_pattern: { type: [string, "null"] }
        match_content_pattern: { type: [string, "null"] }
        distribution_strategy: { $ref: '#/components/schemas/DistributionStrategy' }
        target_connector_id: { type: [string, "null"], format: uuid }
        fallback_route_id: { type: [string, "null"], format: uuid }
        targets: { type: array, items: { $ref: '#/components/schemas/RouteTarget' } }
        status: { type: string, enum: [active, disabled] }

    # ---- exact routes ----
    ExactRoute:
      type: object
      properties:
        msisdn: { type: string }
        target_type: { type: string, enum: [connector, route] }
        target_id: { type: string, format: uuid }
        source: { type: string, enum: [mnp_import, manual, carrier_feed] }
        imported_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
      required: [msisdn, target_type, target_id, source, updated_at]
    ExactRouteCreate:
      type: object
      additionalProperties: false
      properties:
        msisdn: { type: string }
        target_type: { type: string, enum: [connector, route] }
        target_id: { type: string, format: uuid }
        source: { type: string, enum: [mnp_import, manual, carrier_feed], default: manual }
      required: [msisdn, target_type, target_id]
    ExactRouteUpdate:
      type: object
      additionalProperties: false
      properties:
        target_type: { type: string, enum: [connector, route] }
        target_id: { type: string, format: uuid }
        source: { type: string, enum: [mnp_import, manual, carrier_feed] }
    ExactRoutePage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/ExactRoute' } } }
          required: [data]

    # ---- routing scripts ----
    RoutingScript:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/ScriptScope' }
        scope_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        language: { type: string, enum: [js, lua] }
        source_code: { type: string }
        checksum: { type: string }
        status: { type: string, enum: [draft, active, disabled] }
        timeout_ms: { type: integer, minimum: 1, maximum: 20 }
        max_instructions: { type: [integer, "null"] }
        max_memory_kb: { type: [integer, "null"] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
      required: [id, scope, name, language, source_code, checksum, status, timeout_ms, created_at]
    RoutingScriptCreate:
      type: object
      additionalProperties: false
      properties:
        scope: { $ref: '#/components/schemas/ScriptScope' }
        scope_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        language: { type: string, enum: [js, lua] }
        source_code: { type: string }
        timeout_ms: { type: integer, minimum: 1, maximum: 20, default: 2 }
        max_instructions: { type: [integer, "null"] }
        max_memory_kb: { type: [integer, "null"] }
      required: [scope, name, language, source_code]
    RoutingScriptUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        source_code: { type: string }
        timeout_ms: { type: integer, minimum: 1, maximum: 20 }
        max_instructions: { type: [integer, "null"] }
        max_memory_kb: { type: [integer, "null"] }
    ScriptValidateResult:
      type: object
      properties:
        valid: { type: boolean }
        checksum: { type: [string, "null"] }
        errors: { type: array, items: { type: object, properties: { line: { type: [integer, "null"] }, message: { type: string } }, required: [message] } }
      required: [valid]
    ScriptTestRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: object
          properties:
            source_addr: { type: string }
            dest_addr: { type: string }
            content: { type: string }
            account_id: { type: [string, "null"], format: uuid }
            customer_id: { type: [string, "null"], format: uuid }
          required: [source_addr, dest_addr, content]
      required: [message]
    ScriptTestResult:
      type: object
      properties:
        route_id: { type: [string, "null"], format: uuid, description: Null means fall through to declarative. }
        took_ms: { type: number }
        instructions: { type: [integer, "null"] }
        timed_out: { type: boolean }
        error: { type: [string, "null"] }
        logs: { type: array, items: { type: string } }
      required: [took_ms, timed_out]
    ScriptVersion:
      type: object
      properties:
        version: { type: integer }
        checksum: { type: string }
        status: { type: string, enum: [draft, active, disabled] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
      required: [version, checksum, status, created_at]

    # ---- sessions ----
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: [string, "null"], format: uuid }
        connector_id: { type: [string, "null"], format: uuid }
        bind_id: { type: string }
        bind_type: { $ref: '#/components/schemas/BindType' }
        direction: { type: string, enum: [user, smsc], description: 'user = ESME client bind; smsc = outbound.' }
        pod_id: { type: string }
        remote_addr: { type: [string, "null"] }
        window_size: { type: integer }
        connected_at: { type: string, format: date-time }
        last_enquire_link: { type: [string, "null"], format: date-time }
      required: [id, bind_id, bind_type, pod_id, connected_at]
    SessionPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Session' } } }
          required: [data]

    # ---- anti-spam ----
    AntispamRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        rule_type: { type: string, enum: [velocity, content_blacklist, duplicate, reputation] }
        scope: { type: string, enum: [global, customer, smpp_account] }
        scope_id: { type: [string, "null"], format: uuid }
        config_json: { type: object, additionalProperties: true }
        action: { type: string, enum: [block, flag, throttle] }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, rule_type, scope, action, status]
    AntispamRuleCreate:
      type: object
      additionalProperties: false
      properties:
        rule_type: { type: string, enum: [velocity, content_blacklist, duplicate, reputation] }
        scope: { type: string, enum: [global, customer, smpp_account] }
        scope_id: { type: [string, "null"], format: uuid }
        config_json: { type: object, additionalProperties: true }
        action: { type: string, enum: [block, flag, throttle] }
      required: [rule_type, scope, action]
    AntispamRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        config_json: { type: object, additionalProperties: true }
        action: { type: string, enum: [block, flag, throttle] }
        status: { type: string, enum: [active, disabled] }

    # ---- suppression / opt-out ----
    Suppression:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/SuppressionScope' }
        scope_id: { type: [string, "null"], format: uuid }
        msisdn: { type: string }
        source: { $ref: '#/components/schemas/SuppressionSource' }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, scope, msisdn, source, created_at]
    SuppressionCreate:
      type: object
      additionalProperties: false
      properties:
        scope: { $ref: '#/components/schemas/SuppressionScope' }
        scope_id: { type: [string, "null"], format: uuid }
        msisdn: { type: string }
        source: { $ref: '#/components/schemas/SuppressionSource' }
        reason: { type: [string, "null"] }
      required: [scope, msisdn, source]
    SuppressionCheckResult:
      type: object
      properties:
        blocked: { type: boolean }
        matched_scopes:
          type: array
          items:
            type: object
            properties:
              scope: { $ref: '#/components/schemas/SuppressionScope' }
              scope_id: { type: [string, "null"], format: uuid }
            required: [scope]
      required: [blocked, matched_scopes]
    SuppressionPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Suppression' } } }
          required: [data]

    OptOutKeyword:
      type: object
      properties:
        id: { type: string, format: uuid }
        country_code: { type: [string, "null"] }
        keyword: { type: string }
        action: { type: string, enum: [suppress, unsuppress, help] }
        match_type: { type: string, enum: [exact, prefix] }
        auto_reply_template: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
      required: [id, keyword, action, match_type, status]
    OptOutKeywordCreate:
      type: object
      additionalProperties: false
      properties:
        country_code: { type: [string, "null"] }
        keyword: { type: string }
        action: { type: string, enum: [suppress, unsuppress, help] }
        match_type: { type: string, enum: [exact, prefix], default: exact }
        auto_reply_template: { type: [string, "null"] }
      required: [keyword, action]
    OptOutKeywordUpdate:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: string }
        action: { type: string, enum: [suppress, unsuppress, help] }
        match_type: { type: string, enum: [exact, prefix] }
        auto_reply_template: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }

    # ---- inbound numbers / keywords ----
    InboundNumber:
      type: object
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        number_type: { type: string, enum: [shortcode, longcode, alphanumeric] }
        country_code: { type: string }
        mccmnc: { type: [string, "null"] }
        connector_id: { type: [string, "null"], format: uuid }
        account_id: { type: [string, "null"], format: uuid, description: Dedicated account; null = shared. }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, address, number_type, country_code, status]
    InboundNumberCreate:
      type: object
      additionalProperties: false
      properties:
        address: { type: string }
        number_type: { type: string, enum: [shortcode, longcode, alphanumeric] }
        country_code: { type: string }
        mccmnc: { type: [string, "null"] }
        connector_id: { type: [string, "null"], format: uuid }
        account_id: { type: [string, "null"], format: uuid }
      required: [address, number_type, country_code]
    InboundNumberUpdate:
      type: object
      additionalProperties: false
      properties:
        number_type: { type: string, enum: [shortcode, longcode, alphanumeric] }
        mccmnc: { type: [string, "null"] }
        connector_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, disabled] }
    InboundKeyword:
      type: object
      properties:
        id: { type: string, format: uuid }
        inbound_number_id: { type: string, format: uuid }
        keyword: { type: string }
        match_type: { type: string, enum: [exact, prefix, regex] }
        account_id: { type: string, format: uuid }
        priority: { type: integer }
        status: { type: string, enum: [active, disabled] }
      required: [id, inbound_number_id, keyword, match_type, account_id, status]
    InboundKeywordCreate:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: string }
        match_type: { type: string, enum: [exact, prefix, regex], default: prefix }
        account_id: { type: string, format: uuid }
        priority: { type: integer, default: 0 }
      required: [keyword, account_id]
    InboundKeywordUpdate:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: string }
        match_type: { type: string, enum: [exact, prefix, regex] }
        account_id: { type: string, format: uuid }
        priority: { type: integer }
        status: { type: string, enum: [active, disabled] }

    # ---- sender rewrite ----
    SenderRewriteRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/RewriteScope' }
        scope_id: { type: [string, "null"], format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        match_sender_pattern: { type: [string, "null"] }
        match_dest_pattern: { type: [string, "null"] }
        rewrite_type: { type: string, enum: [static, fallback_pool, truncate, sanitize] }
        rewrite_to: { type: [string, "null"] }
        fallback_pool_json: { type: [array, "null"], items: { type: string } }
        max_length: { type: [integer, "null"], minimum: 1 }
        sanitize_charset_json: { type: [object, "null"], additionalProperties: true }
        priority: { type: integer }
        reason: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, scope, direction, rewrite_type, priority, status]
    SenderRewriteRuleCreate:
      type: object
      additionalProperties: false
      properties:
        scope: { $ref: '#/components/schemas/RewriteScope' }
        scope_id: { type: [string, "null"], format: uuid }
        direction: { $ref: '#/components/schemas/Direction', description: Only mt is accepted — no engine evaluates mo rules yet. }
        match_sender_pattern: { type: [string, "null"], description: 'RE2 regex matched against the whole address (implicitly anchored) — the sender as the client submitted it, the destination as digits only with no +; null matches any. Unlike a route''s match_dest_pattern, not a digit prefix.' }
        match_dest_pattern: { type: [string, "null"], description: 'RE2 regex matched against the whole address (implicitly anchored) — the sender as the client submitted it, the destination as digits only with no +; null matches any. Unlike a route''s match_dest_pattern, not a digit prefix.' }
        rewrite_type: { type: string, enum: [static, fallback_pool, truncate, sanitize] }
        rewrite_to: { type: [string, "null"], description: 'Required when rewrite_type = static; at most 20 octets, the SMPP source_addr.' }
        fallback_pool_json: { type: [array, "null"], items: { type: string }, description: 'Required and non-empty when rewrite_type = fallback_pool; each entry at most 20 octets, the SMPP source_addr. The sender is picked by hashing the message id: every segment of a message gets the same one, and the spread over messages is statistical, not a strict rotation.' }
        max_length: { type: [integer, "null"], minimum: 1, description: Required when rewrite_type = truncate. }
        sanitize_charset_json: { type: [object, "null"], additionalProperties: true, description: 'Read when rewrite_type = sanitize: {"allowed": "<characters kept>"}, listed one by one (not ranges); every other character is removed. Null keeps ASCII letters and digits.' }
        priority: { type: integer, default: 100, description: 'Lower is evaluated first within a scope; scopes are evaluated connector, smpp_account, customer, platform.' }
        reason: { type: [string, "null"] }
      required: [scope, rewrite_type]
    SenderRewriteRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        match_sender_pattern: { type: [string, "null"], description: 'RE2 regex matched against the whole address (implicitly anchored) — the sender as the client submitted it, the destination as digits only with no +; null matches any. Unlike a route''s match_dest_pattern, not a digit prefix.' }
        match_dest_pattern: { type: [string, "null"], description: 'RE2 regex matched against the whole address (implicitly anchored) — the sender as the client submitted it, the destination as digits only with no +; null matches any. Unlike a route''s match_dest_pattern, not a digit prefix.' }
        rewrite_type: { type: string, enum: [static, fallback_pool, truncate, sanitize] }
        rewrite_to: { type: [string, "null"] }
        fallback_pool_json: { type: [array, "null"], items: { type: string } }
        max_length: { type: [integer, "null"], minimum: 1 }
        sanitize_charset_json: { type: [object, "null"], additionalProperties: true, description: 'Read when rewrite_type = sanitize: {"allowed": "<characters kept>"}, listed one by one (not ranges); every other character is removed. Null keeps ASCII letters and digits.' }
        priority: { type: integer }
        reason: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }

    # ---- billing ----
    Balance:
      type: object
      properties:
        owner_type: { $ref: '#/components/schemas/BalanceScope' }
        owner_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        credits: { type: integer, description: Integer SMS credit count (may be negative). }
        updated_at: { type: string, format: date-time }
      required: [owner_type, owner_id, direction, credits]
    BillingCustomer:
      type: object
      properties:
        customer_id: { type: string, format: uuid }
        billing_mode: { type: string, enum: [prepaid, postpaid] }
        overdraft_enabled: { type: boolean }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean }
        external_billing_provider_id: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }
      required: [customer_id, billing_mode, overdraft_enabled, credit_limit_is_hard]
    BillingCustomerUpdate:
      type: object
      additionalProperties: false
      properties:
        billing_mode: { type: string, enum: [prepaid, postpaid] }
        overdraft_enabled: { type: boolean }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean }
        external_billing_provider_id: { type: [string, "null"], format: uuid }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_type: { $ref: '#/components/schemas/BalanceScope' }
        owner_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        customer_id: { type: string, format: uuid }
        account_id: { type: [string, "null"], format: uuid }
        message_id: { type: [string, "null"], format: uuid }
        entry_type: { type: string, enum: [reserve, capture, release, refund, topup, adjustment, mo_charge, transfer] }
        credits: { type: integer, description: Signed. }
        balance_after: { type: integer }
        reference: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, owner_type, owner_id, direction, customer_id, entry_type, credits, balance_after, created_at]
    LedgerPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } } }
          required: [data]

    RatePlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        credits_per_segment_mt_json: { type: object, additionalProperties: true, description: "Integer credits per MT segment, by MCC-MNC/country + sender type." }
        credits_per_segment_mo_json: { type: object, additionalProperties: true }
        billing_mode: { type: string, enum: [prepaid, postpaid, either] }
        charge_on: { type: string, enum: [submission, delivery] }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, credits_per_segment_mt_json, credits_per_segment_mo_json, billing_mode, charge_on, status]
    RatePlanCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        credits_per_segment_mt_json: { type: object, additionalProperties: true }
        credits_per_segment_mo_json: { type: object, additionalProperties: true }
        billing_mode: { type: string, enum: [prepaid, postpaid, either], default: either }
        charge_on: { type: string, enum: [submission, delivery], default: submission }
      required: [name, credits_per_segment_mt_json, credits_per_segment_mo_json]
    RatePlanUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        credits_per_segment_mt_json: { type: object, additionalProperties: true }
        credits_per_segment_mo_json: { type: object, additionalProperties: true }
        billing_mode: { type: string, enum: [prepaid, postpaid, either] }
        charge_on: { type: string, enum: [submission, delivery] }
        status: { type: string, enum: [active, disabled] }

    ExternalBillingProvider:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string, format: uri }
        auth_config_json: { type: object, additionalProperties: true, description: Masked on read. }
        mode: { type: string, enum: [balance_check, consume_delegate_async, consume_delegate_sync, both] }
        cache_ttl_ms: { type: integer, minimum: 0 }
        sync_call_timeout_ms: { type: [integer, "null"], minimum: 1 }
        failure_policy: { type: string, enum: [fail_open, fail_closed] }
        status: { type: string, enum: [active, disabled] }
      required: [id, name, base_url, mode, failure_policy, status]
    ExternalBillingProviderCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        base_url: { type: string, format: uri }
        auth_config_json: { type: object, additionalProperties: true }
        mode: { type: string, enum: [balance_check, consume_delegate_async, consume_delegate_sync, both] }
        cache_ttl_ms: { type: integer, minimum: 0, default: 1000 }
        sync_call_timeout_ms: { type: [integer, "null"], minimum: 1 }
        failure_policy: { type: string, enum: [fail_open, fail_closed], default: fail_open }
      required: [name, base_url, mode]
    ExternalBillingProviderUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        base_url: { type: string, format: uri }
        auth_config_json: { type: object, additionalProperties: true }
        mode: { type: string, enum: [balance_check, consume_delegate_async, consume_delegate_sync, both] }
        cache_ttl_ms: { type: integer, minimum: 0 }
        sync_call_timeout_ms: { type: [integer, "null"], minimum: 1 }
        failure_policy: { type: string, enum: [fail_open, fail_closed] }
        status: { type: string, enum: [active, disabled] }

    # ---- content & rgpd ----
    ContentPolicy:
      type: object
      additionalProperties: false
      description: Governs CDR body storage only; logs/traces never carry the body (§6.11).
      properties:
        content_storage: { $ref: '#/components/schemas/ContentStorage' }
        content_retention_days: { type: [integer, "null"], minimum: 0 }
      required: [content_storage]
    ContentKey:
      type: object
      description: Metadata only — the wrapped key material is never exposed via the API.
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        kms_key_ref: { type: string }
        status: { type: string, enum: [active, retired, destroyed] }
        created_at: { type: string, format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
        destroyed_at: { type: [string, "null"], format: date-time }
      required: [id, customer_id, kms_key_ref, status, created_at]
    MessageContent:
      type: object
      description: Decrypted body — returned only under content:read, and audited.
      properties:
        message_id: { type: string, format: uuid }
        text: { type: string }
        encoding: { type: string, enum: [gsm7, ucs2, binary] }
        decrypted_at: { type: string, format: date-time }
      required: [message_id, text, decrypted_at]
    GdprEraseJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [customer, msisdn] }
        subject_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        attestation: { type: [string, "null"], description: Erasure attestation reference when completed. }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      required: [job_id, subject_type, subject_id, status, created_at]

    # ---- messages: trace / search / export ----
    MessageTrace:
      type: object
      description: >-
        Lifecycle timeline of a message, one entry per recorded stage, built from the durable CDR event log.
        Span-level detail lives in the tracing backend — pivot on trace_id. NEVER carries the body.
      properties:
        message_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        spans:
          type: array
          items:
            type: object
            properties:
              name: { type: string, examples: ['cdr.accepted', 'cdr.enroute', 'cdr.delivered'] }
              start: { type: string, format: date-time }
              end: { type: [string, "null"], format: date-time }
              duration_ms: { type: [number, "null"] }
              status: { type: string, enum: [ok, error] }
              attributes: { type: object, additionalProperties: true }
            required: [name, start, status]
      required: [message_id, trace_id, spans]
    MessageSummary:
      type: object
      description: CDR projection (columnar store). No body.
      properties:
        message_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        source_addr: { type: string }
        dest_addr: { type: string }
        original_source_addr: { type: [string, "null"] }
        connector_id: { type: [string, "null"], format: uuid }
        route_id: { type: [string, "null"], format: uuid }
        status: { $ref: '#/components/schemas/CdrStatus' }
        error_code: { type: [string, "null"] }
        segment_count: { type: integer }
        encoding: { type: [string, "null"], enum: [gsm7, ucs2, binary, null] }
        submitted_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        latency_ms: { type: [integer, "null"] }
        billed: { type: boolean }
        credits_charged: { type: [integer, "null"] }
      required: [message_id, trace_id, account_id, customer_id, direction, source_addr, dest_addr, status, segment_count, submitted_at]
    MessageSummaryPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } } }
          required: [data]
    MessageExportRequest:
      type: object
      additionalProperties: false
      properties:
        filters: { $ref: '#/components/schemas/MessageExportFilters' }
        # parquet is deliberately absent: the export is masked per role — a gateway-side rule — so the
        # file is written by the gateway rather than by ClickHouse, and a columnar encoder is a
        # dependency nothing needs yet.
        format: { type: string, enum: [csv, jsonl], default: csv }
        mask_msisdn:
          type: boolean
          default: true
          description: >-
            Role-based MSISDN masking (§5.3). Setting it to false requires msisdn:reveal; without that
            scope the request is REFUSED rather than silently masked, so an operator never mistakes a
            masked artefact for an unmasked one.
      required: [filters]
    MessageExportFilters:
      type: object
      additionalProperties: false
      description: >-
        The search-messages predicates, combined with AND. Unknown members are refused rather than
        ignored: an ignored filter would widen an export instead of narrowing it.
      properties:
        traceId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CdrStatus' }
        direction: { $ref: '#/components/schemas/Direction' }
        msisdn: { type: string, description: Exact E.164 match on either address. }
        from_date: { type: string, format: date-time }
        to_date: { type: string, format: date-time }
      required: [from_date, to_date]
    ExportJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        row_count: { type: [integer, "null"] }
        download_url: { type: [string, "null"], format: uri, description: Present when completed; expires. }
        expires_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"], description: Why a failed job failed; null otherwise. }
        created_at: { type: string, format: date-time }
      required: [job_id, status, created_at]

    # ---- metrics ----
    MetricsSummary:
      type: object
      properties:
        window: { type: string }
        submitted: { type: integer }
        delivered: { type: integer }
        failed: { type: integer, description: Failed or expired. }
        rejected: { type: integer }
        mo_received: { type: integer }
        ingest_latency_ms_p50: { type: [number, "null"] }
        ingest_latency_ms_p99: { type: [number, "null"], description: Null while ingestion latency is measured nowhere. }
        e2e_latency_ms_p50: { type: [number, "null"] }
        e2e_latency_ms_p99: { type: [number, "null"], description: 'Per message, from submission to its delivery receipt.' }
        active_sessions: { type: integer, description: Absent while the session registry keeps no global count. }
      required: [window]
    TrafficMetrics:
      type: object
      properties:
        group_by: { type: string, enum: [connector, customer, group] }
        window: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: 'Dimension value (connector/customer/group id), or the reserved keys other and ungrouped.' }
              points:
                type: array
                items:
                  type: object
                  properties:
                    t: { type: string, format: date-time }
                    submitted: { type: integer }
                    delivered: { type: integer }
                    failed: { type: integer }
                  required: [t]
            required: [key, points]
      required: [group_by, window, series]
