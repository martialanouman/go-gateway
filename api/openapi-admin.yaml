      tags: [Sessions]
      summary: Force-disconnect a session
      operationId: disconnect-session
      description: >-
        Orders the pod holding the bind to send an unbind and close the connection, with reason
        `operator_disconnect`. The close is asynchronous: 204 means the order was published, and the
        session leaves the list once its pod has closed it. An id that is not a live session is a 404.
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '204': { description: Disconnect ordered. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

