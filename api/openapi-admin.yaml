openapi: 3.1.0

# =====================================================================================================
#  SMS Gateway — ADMIN API (internal, consumed by the Admin Dashboard)   §5.3
#
#  SOURCE OF TRUTH. The chi + Huma implementation MUST conform to this document. Same conventions as the
#  public spec: OpenAPI 3.1 / JSON Schema 2020-12, nullable via type:[T,"null"], a flat application/json
#  error model { code, message, errors[] } (Huma's RFC 9457 default overridden via huma.NewError), and
#  kebab-case operationId.
#  Schemas are aligned field-for-field with the PostgreSQL control plane (schema_passerelle_sms.sql).
#  Secrets (passwords, API keys, wrapped content keys, provider auth) are NEVER returned — only masked,
#  except the one-time secret at credential create/rotate. There is NO self-service surface here: this
#  API is operator-only and enforces fine-grained scopes (content:read, content:erase, gdpr:erase, ...).
# =====================================================================================================

info:
  title: SMS Gateway — Admin API
  version: "1.0.0"
  description: |
    Internal control-plane API for the Admin Dashboard. Provisions and manages customers, SMPP accounts,
    credentials, connectors, routes, routing scripts, anti-spam, opt-out, inbound numbers, sender-ID
    rewrite, billing, content policy & RGPD erasure, plus message tracing/search/export and real-time
    metrics. Operators authenticate with a bearer token; each operation declares the required scope(s).
  license:
    name: Proprietary

servers:
  - url: https://admin.gateway.internal/v1
    description: Internal (mTLS + operator bearer)

security:
  - OperatorBearer: []

tags:
  - name: Customer Groups
  - name: Customers
  - name: Sender IDs
  - name: SMPP Accounts
  - name: Credentials
  - name: Connectors
  - name: Routes
  - name: Exact Routes
  - name: Routing Scripts
  - name: Sessions
  - name: Anti-spam
  - name: Suppression
  - name: Opt-out Keywords
  - name: Inbound Numbers
  - name: Sender Rewrite
  - name: Billing
  - name: Rate Plans
  - name: Billing Providers
  - name: Content & RGPD
  - name: Messages
  - name: Metrics
  - name: Realtime

paths:

  # ============================ CUSTOMER GROUPS (§6.17) ============================
  /admin/customer-groups:
    get:
      tags: [Customer Groups]
      summary: List customer groups
      operationId: list-customer-groups
      parameters: [ { $ref: '#/components/parameters/Status' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomerGroup' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Customer Groups]
      summary: Create a customer group
      operationId: create-customer-group
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroupCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/customer-groups/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Customer Groups]
      summary: Get a customer group
      operationId: get-customer-group
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroup' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customer Groups]
      summary: Update a customer group
      operationId: update-customer-group
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroupUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroup' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Customer Groups]
      summary: Delete a group (non-destructive — detaches customers, group_id -> null)
      operationId: delete-customer-group
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/customer-groups/{id}/customers:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Customer Groups]
      summary: List customers in a group
      operationId: list-group-customers
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ CUSTOMERS (§6.18) ============================
  /admin/customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: list-customers
      parameters:
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Customers]
      summary: Create a customer
      operationId: create-customer
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/customers/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Customers]
      summary: Get a customer
      operationId: get-customer
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Customers]
      summary: Update a customer
      operationId: update-customer
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Customers]
      summary: Delete a customer
      operationId: delete-customer
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/customers/{id}/group:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Customers]
      summary: Set (or clear) a customer's group
      operationId: set-customer-group
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { group_id: { type: [string, "null"], format: uuid } }, required: [group_id] } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/customers/{id}/suspend:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Customers]
      summary: Suspend a customer (cascades — suspends all its SMPP accounts)
      operationId: suspend-customer
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---- Sender IDs (customer-level) ----
  /admin/customers/{id}/sender-ids:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Sender IDs]
      summary: List a customer's sender IDs
      operationId: list-sender-ids
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SenderId' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Sender IDs]
      summary: Register a sender ID (starts pending carrier approval)
      operationId: create-sender-id
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SenderIdCreate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SenderId' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/customers/{id}/sender-ids/{senderId}:
    parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/SenderId' } ]
    patch:
      tags: [Sender IDs]
      summary: Update a sender ID (status)
      operationId: update-sender-id
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SenderIdUpdate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SenderId' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sender IDs]
      summary: Delete a sender ID
      operationId: delete-sender-id
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/customers/{id}/smpp-accounts:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Customers]
      summary: List a customer's SMPP accounts
      operationId: list-customer-accounts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SmppAccount' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ SMPP ACCOUNTS (§6.18) ============================
  /admin/smpp-accounts:
    get:
      tags: [SMPP Accounts]
      summary: List SMPP accounts
      operationId: list-smpp-accounts
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccountPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [SMPP Accounts]
      summary: Create an SMPP account (requires customerId)
      operationId: create-smpp-account
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccountCreate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/smpp-accounts/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [SMPP Accounts]
      summary: Get an SMPP account
      operationId: get-smpp-account
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [SMPP Accounts]
      summary: Update an SMPP account
      operationId: update-smpp-account
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccountUpdate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [SMPP Accounts]
      summary: Delete an SMPP account
      operationId: delete-smpp-account
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/smpp-accounts/{id}/suspend:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [SMPP Accounts]
      summary: Suspend an SMPP account
      operationId: suspend-smpp-account
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/smpp-accounts/{id}/channels:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [SMPP Accounts]
      summary: Enable/disable channels (at least one must stay true)
      operationId: set-account-channels
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelsUpdate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/smpp-accounts/{id}/session-limits:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [SMPP Accounts]
      summary: Set max_sessions and allowed bind types
      operationId: set-account-session-limits
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionLimitsUpdate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/smpp-accounts/{id}/sessions:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [SMPP Accounts]
      summary: Live binds vs maxSessions for this account
      operationId: list-account-sessions
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { max_sessions: { type: integer }, active: { type: integer }, sessions: { type: array, items: { $ref: '#/components/schemas/Session' } } }, required: [max_sessions, active, sessions] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/smpp-accounts/{id}/sender-id-policy:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [SMPP Accounts]
      summary: Set sender-ID authorization policy (§6.19)
      operationId: set-account-sender-id-policy
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { sender_id_policy: { $ref: '#/components/schemas/SenderIdPolicy' } }, required: [sender_id_policy] } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }
  /admin/smpp-accounts/{id}/smpp-ops:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [SMPP Accounts]
      summary: Toggle optional SMPP ops query_sm / cancel_sm (§6.22)
      operationId: set-account-smpp-ops
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { query_sm_enabled: { type: boolean }, cancel_sm_enabled: { type: boolean } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SmppAccount' } } } }

  # ---- Webhooks (per account) ----
  /admin/smpp-accounts/{id}/webhooks:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [SMPP Accounts]
      summary: List webhooks
      operationId: list-webhooks
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Webhook' } } } } }
    post:
      tags: [SMPP Accounts]
      summary: Create a webhook (one per event_type)
      operationId: create-webhook
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/smpp-accounts/{id}/webhooks/{webhookId}:
    parameters: [ { $ref: '#/components/parameters/Id' }, { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [SMPP Accounts]
      summary: Update a webhook
      operationId: update-webhook
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [SMPP Accounts]
      summary: Delete a webhook
      operationId: delete-webhook
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ CREDENTIALS (§6.3/§6.18) ============================
  /admin/smpp-accounts/{id}/credentials:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Credentials]
      summary: List credentials (masked — never a secret)
      operationId: list-credentials
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Credential' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Credentials]
      summary: Create a credential — secret returned exactly once
      operationId: create-credential
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { type: { type: string, enum: [smpp_bind, api_key] }, system_id: { type: [string, "null"], minLength: 1, maxLength: 15, description: 'Required for smpp_bind. Bounded by the SMPP bind field (v3.4 §4.1.1).' } }, required: [type] } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '201': { description: Created; the secret is present once and never retrievable again., content: { application/json: { schema: { $ref: '#/components/schemas/CredentialWithSecret' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/smpp-accounts/{id}/credentials/{credId}:
    parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CredId' } ]
    patch:
      tags: [Credentials]
      summary: Update a credential (status only)
      operationId: update-credential-status
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [active, disabled, revoked] } }, required: [status] } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Credentials]
      summary: Revoke a credential (force-unbinds live sessions)
      operationId: revoke-credential
      security: [ { OperatorBearer: [ admin:write ] } ]
      description: The credential row is retained with status=revoked; re-creating this type on the account conflicts (409). Use rotate to issue a new secret.
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/smpp-accounts/{id}/credentials/{credId}/rotate:
    parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CredId' } ]
    post:
