  # ============================ SESSIONS ============================
  /admin/sessions:
    get:
      tags: [Sessions]
      summary: List live SMPP sessions
      operationId: list-sessions
      description: >-
        Client (ESME) binds, in bind id order, read from the live session registry. The registry is
        volatile and gives no snapshot: a session closed between two pages is missing from both, and one
        opened below the cursor is not seen. A page can hold fewer than `limit` sessions while `has_more`
        is true. `connectorId` is refused with 422: outbound connector binds are not in the registry, read
        them with get-connector-status.
      security: [ { OperatorBearer: [ admin:read ] } ]
      parameters:
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
        - { name: connectorId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/sessions/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
