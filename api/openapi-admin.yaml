  # ============================ SENDER REWRITE (§6.16) ============================
  /admin/sender-rewrite-rules:
    get:
      tags: [Sender Rewrite]
      summary: List sender-ID rewrite rules
      description: In evaluation order — scope (connector, smpp_account, customer, platform), then priority.
      operationId: list-sender-rewrite-rules
      parameters: [ { name: scope, in: query, schema: { $ref: '#/components/schemas/RewriteScope' } }, { name: scopeId, in: query, schema: { type: string, format: uuid } } ]
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SenderRewriteRule' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Sender Rewrite]
      summary: Create a rewrite rule
      operationId: create-sender-rewrite-rule
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SenderRewriteRuleCreate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SenderRewriteRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/sender-rewrite-rules/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Sender Rewrite]
      summary: Update a rewrite rule
      description: Validated on the rule the patch leaves behind, since rewrite_type is mutable.
      operationId: update-sender-rewrite-rule
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SenderRewriteRuleUpdate' } } } }
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SenderRewriteRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sender Rewrite]
      summary: Delete a rewrite rule
      operationId: delete-sender-rewrite-rule
      security: [ { OperatorBearer: [ admin:write ] } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/sender-rewrite-rules/{id}/test:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Sender Rewrite]
      summary: Test a rewrite rule against a sample
      description: Runs this rule alone — whatever its status, without the precedence of the others — through the code connector-pool applies before the submit_sm. Writes nothing.
      operationId: test-sender-rewrite-rule
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { source_addr: { type: string, description: The sender as the client submits it. }, dest_addr: { type: string, description: 'The destination as the pool sees it: digits only, no +.' }, message_id: { type: string, format: uuid, description: 'A fallback_pool rule picks its sender from the message id; give a CDR''s to reproduce its choice. Absent means the nil UUID.' } }, required: [source_addr, dest_addr] } } } }
      security: [ { OperatorBearer: [ admin:read ] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { matched: { type: boolean }, rewritten_source: { type: [string, "null"], description: 'The sender the pool would submit, before the SMPP typing: a leading + is stripped on the wire and the number typed international.' } }, required: [matched] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

