opencollection: 1.0.0
info:
  name: SMS Gateway — Admin API
  summary: |
    OpenCollection for the internal Admin API (api/openapi-admin.yaml).
    Contains only the endpoints currently implemented by admin-api-svc
    (internal/adminapi), grouped by tag.

    Auth: operator bearer token. The service reads HTTP_ADMIN_TOKENS as
    "token:scope|scope" entries and the client sends only the token (subject)
    part as `Authorization: Bearer <token>`. For local runs configure e.g.
      HTTP_ADMIN_TOKENS=dev-operator-token:admin:read|admin:write
    and set the `operatorToken` env var to `dev-operator-token`.

    Path IDs are collection variables (customerId, accountId, ...) so mutating
    requests are runnable once you paste real UUIDs. Optional query filters are
    present but disabled by default.
config:
  environments:
    - name: Local
      description: admin-api-svc on localhost (HTTP_PORT=8081, mounted at /v1).
      variables:
        - name: baseUrl
          value: http://localhost:8081/v1
        - name: operatorToken
          value: dev-operator-token
request:
  auth:
    type: bearer
    token: '{{operatorToken}}'
  headers:
    - name: Accept
      value: application/json
  variables:
    - name: customerId
      value: 00000000-0000-0000-0000-000000000000
    - name: groupId
      value: 00000000-0000-0000-0000-000000000000
    - name: accountId
      value: 00000000-0000-0000-0000-000000000000
    - name: senderId
      value: 00000000-0000-0000-0000-000000000000
    - name: credId
      value: 00000000-0000-0000-0000-000000000000
    - name: connectorId
      value: 00000000-0000-0000-0000-000000000000
    - name: routeId
      value: 00000000-0000-0000-0000-000000000000
    - name: inboundNumberId
      value: 00000000-0000-0000-0000-000000000000
    - name: keywordId
      value: 00000000-0000-0000-0000-000000000000
items:
  - info:
      name: Customers
      type: folder
    items:
      - info:
          name: list-customers
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/customers'
          params:
            - name: groupId
              value: '{{groupId}}'
              type: query
              disabled: true
            - name: status
              value: active
              type: query
              disabled: true
            - name: cursor
              value: ''
              type: query
              disabled: true
            - name: limit
              value: '50'
              type: query
              disabled: true
        docs: List customers (scope admin:read).
      - info:
          name: create-customer
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/customers'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "name": "Acme Corp",
                "billing_enabled": false,
                "overdraft_enabled": false,
                "balance_scope": "customer",
                "content_storage": "inherit"
              }
        docs: Create a customer (scope admin:write).
      - info:
          name: get-customer
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/customers/{{customerId}}'
        docs: Get a customer (scope admin:read).
      - info:
          name: update-customer
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/customers/{{customerId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "name": "Acme Corporation",
                "status": "active",
                "billing_enabled": true
              }
        docs: Update a customer (scope admin:write).
      - info:
          name: delete-customer
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/customers/{{customerId}}'
        docs: Delete a customer (scope admin:write).
      - info:
          name: suspend-customer
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/customers/{{customerId}}/suspend'
        docs: Suspend a customer (cascades to its SMPP accounts).
  - info:
      name: Sender IDs
      type: folder
    items:
      - info:
          name: list-sender-ids
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/customers/{{customerId}}/sender-ids'
        docs: List a customer's sender IDs (scope admin:read).
      - info:
          name: create-sender-id
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/customers/{{customerId}}/sender-ids'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "address": "ACME"
              }
        docs: Register a sender ID (starts pending carrier approval).
      - info:
          name: update-sender-id
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/customers/{{customerId}}/sender-ids/{{senderId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "status": "active"
              }
        docs: Update a sender ID status.
      - info:
          name: delete-sender-id
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/customers/{{customerId}}/sender-ids/{{senderId}}'
        docs: Delete a sender ID.
  - info:
      name: SMPP Accounts
      type: folder
    items:
      - info:
          name: list-smpp-accounts
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/smpp-accounts'
          params:
            - name: customerId
              value: '{{customerId}}'
              type: query
              disabled: true
            - name: groupId
              value: '{{groupId}}'
              type: query
              disabled: true
            - name: status
              value: active
              type: query
              disabled: true
            - name: cursor
              value: ''
              type: query
              disabled: true
            - name: limit
              value: '50'
              type: query
              disabled: true
        docs: List SMPP accounts (scope admin:read).
      - info:
          name: create-smpp-account
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/smpp-accounts'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "customer_id": "{{customerId}}",
                "name": "acme-primary",
                "smpp_enabled": true,
                "rest_enabled": true,
                "sender_id_policy": "strict",
                "allowed_bind_types": "trx",
                "max_sessions": 4
              }
        docs: Create an SMPP account (requires customer_id).
      - info:
          name: get-smpp-account
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}'
        docs: Get an SMPP account (scope admin:read).
      - info:
          name: update-smpp-account
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "name": "acme-primary",
                "status": "active"
              }
        docs: Update an SMPP account (scope admin:write).
      - info:
          name: delete-smpp-account
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}'
        docs: Delete an SMPP account (scope admin:write).
      - info:
          name: set-account-channels
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/channels'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "smpp_enabled": true,
                "rest_enabled": true
              }
        docs: Enable/disable channels (at least one must stay true).
      - info:
          name: set-account-session-limits
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/session-limits'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "max_sessions": 4,
                "allowed_bind_types": "trx"
              }
        docs: Set max_sessions and allowed bind types.
  - info:
      name: Credentials
      type: folder
    items:
      - info:
          name: list-credentials
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/credentials'
        docs: List credentials (masked — never a secret).
      - info:
          name: create-credential
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/credentials'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "type": "smpp_bind",
                "system_id": "acme_sysid"
              }
        docs: Create a credential — secret returned exactly once.
      - info:
          name: update-credential-status
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/credentials/{{credId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "status": "disabled"
              }
        docs: Update a credential (status only).
      - info:
          name: revoke-credential
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/credentials/{{credId}}'
        docs: Revoke a credential (force-unbinds live sessions).
      - info:
          name: rotate-credential
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/smpp-accounts/{{accountId}}/credentials/{{credId}}/rotate'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "grace_period_sec": 3600
              }
        docs: Rotate a credential (optional grace window); new secret once.
  - info:
      name: Connectors
      type: folder
    items:
      - info:
          name: list-connectors
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/connectors'
        docs: List SMSC connectors (scope admin:read).
      - info:
          name: create-connector
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/connectors'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "name": "carrier-a-primary",
                "host": "smsc.carrier-a.example.com",
                "port": 2775,
                "bind_type": "trx",
                "system_id": "gateway",
                "password": "smsc-password",
                "interface_version": 52,
                "window_size": 10,
                "bind_pool_size": 2,
                "tls_enabled": false,
                "auto_reconnect_enabled": true
              }
        docs: Create a connector (scope admin:write).
      - info:
          name: get-connector
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}'
        docs: Get a connector (scope admin:read).
      - info:
          name: update-connector
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "window_size": 20,
                "status": "active"
              }
        docs: Update a connector (scope admin:write).
      - info:
          name: delete-connector
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}'
        docs: Delete a connector (scope admin:write).
      - info:
          name: rebind-connector
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}/rebind'
        docs: Manually rebind (reconnect) a connector (scope admin:write).
      - info:
          name: get-connector-status
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}/status'
        docs: Live link_status + breaker_state, per bind (scope admin:read).
      - info:
          name: set-connector-reconnect-policy
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}/reconnect-policy'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "auto_reconnect_enabled": true,
                "reconnect_initial_delay_ms": 1000,
                "reconnect_max_attempts": 0
              }
        docs: Set auto-reconnect policy (scope admin:write).
      - info:
          name: set-connector-bind-pool
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/connectors/{{connectorId}}/bind-pool'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "bind_pool_size": 4
              }
        docs: Resize the bind pool (scope admin:write).
  - info:
      name: Routes
      type: folder
    items:
      - info:
          name: list-routes
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/routes'
        docs: List routes ordered by priority (scope admin:read).
      - info:
          name: create-route
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/routes'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "name": "default-static",
                "priority": 100,
                "distribution_strategy": "static",
                "target_connector_id": "{{connectorId}}"
              }
        docs: Create a route (scope admin:write).
      - info:
          name: get-route
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/routes/{{routeId}}'
        docs: Get a route (scope admin:read).
      - info:
          name: update-route
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/routes/{{routeId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "priority": 50,
                "status": "active"
              }
        docs: Update a route (scope admin:write).
      - info:
          name: delete-route
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/routes/{{routeId}}'
        docs: Delete a route (scope admin:write).
  - info:
      name: Inbound Numbers
      type: folder
    items:
      - info:
          name: list-inbound-numbers
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/inbound-numbers'
        docs: List inbound numbers (scope admin:read).
      - info:
          name: create-inbound-number
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/inbound-numbers'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "address": "36000",
                "number_type": "shortcode",
                "country_code": "FR",
                "connector_id": "{{connectorId}}"
              }
        docs: Create an inbound number (scope admin:write).
      - info:
          name: update-inbound-number
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "status": "disabled"
              }
        docs: Update an inbound number (scope admin:write).
      - info:
          name: delete-inbound-number
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}'
        docs: Delete an inbound number (scope admin:write).
      - info:
          name: assign-inbound-number
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}/assign'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "account_id": "{{accountId}}"
              }
        docs: Assign an inbound number to an account, or clear to shared (scope admin:write).
      - info:
          name: list-inbound-keywords
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}/keywords'
        docs: List the keyword mappings of a shared inbound number (scope admin:read).
      - info:
          name: create-inbound-keyword
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}/keywords'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "keyword": "INFO",
                "match_type": "prefix",
                "account_id": "{{accountId}}",
                "priority": 0
              }
        docs: Add a keyword mapping to a shared inbound number (scope admin:write).
      - info:
          name: update-inbound-keyword
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}/keywords/{{keywordId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "status": "disabled"
              }
        docs: Update a keyword mapping (scope admin:write).
      - info:
          name: delete-inbound-keyword
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/inbound-numbers/{{inboundNumberId}}/keywords/{{keywordId}}'
        docs: Delete a keyword mapping (scope admin:write).
      - info:
          name: list-unrouted-mo
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/mo/unrouted?limit=50'
        docs: List mobile-originated messages that resolved to no account (scope admin:read).
  - info:
      name: Suppression
      type: folder
    items:
      - info:
          name: list-suppressions
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/suppressions?limit=50'
        docs: List suppressions (scope admin:read).
      - info:
          name: create-suppression
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/suppressions'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "scope": "platform",
                "msisdn": "33612345678",
                "source": "admin"
              }
        docs: Add a suppression (scope admin:write).
      - info:
          name: import-suppressions
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/suppressions/import'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "scope": "platform",
                "source": "import",
                "msisdns": ["33612345678", "33698765432"]
              }
        docs: Bulk import suppressions, idempotent (scope admin:write).
      - info:
          name: check-suppression
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/suppressions/check'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "msisdn": "33612345678",
                "sender_addr": "36000",
                "account_id": "{{accountId}}"
              }
        docs: Would this recipient be blocked, and by which scope? (scope admin:read).
      - info:
          name: delete-suppression
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/suppressions/{{suppressionId}}'
        docs: Un-suppress by id, audit-logged (scope admin:write).
  - info:
      name: Opt-out Keywords
      type: folder
    items:
      - info:
          name: list-opt-out-keywords
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/opt-out-keywords'
        docs: List opt-out keywords (scope admin:read).
      - info:
          name: create-opt-out-keyword
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/opt-out-keywords'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "keyword": "STOP",
                "action": "suppress",
                "match_type": "exact",
                "auto_reply_template": "You are unsubscribed."
              }
        docs: Create an opt-out keyword (scope admin:write).
      - info:
          name: update-opt-out-keyword
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/opt-out-keywords/{{optOutKeywordId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "status": "disabled"
              }
        docs: Update an opt-out keyword (scope admin:write).
      - info:
          name: delete-opt-out-keyword
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/opt-out-keywords/{{optOutKeywordId}}'
        docs: Delete an opt-out keyword (scope admin:write).
  - info:
      name: Anti-spam
      type: folder
    items:
      - info:
          name: list-antispam-rules
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/antispam-rules'
        docs: List anti-spam rules (scope admin:read).
      - info:
          name: create-antispam-rule
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/antispam-rules'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "rule_type": "content_blacklist",
                "scope": "global",
                "action": "block",
                "config_json": { "patterns": ["(?i)\\bviagra\\b"] }
              }
        docs: Create an anti-spam rule (scope admin:write).
      - info:
          name: update-antispam-rule
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/antispam-rules/{{antispamRuleId}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "status": "disabled"
              }
        docs: Update an anti-spam rule (scope admin:write).
      - info:
          name: delete-antispam-rule
          type: http
        http:
          method: DELETE
          url: '{{baseUrl}}/admin/antispam-rules/{{antispamRuleId}}'
        docs: Delete an anti-spam rule (scope admin:write).
  - info:
      name: Exact Routes
      type: folder
    items:
      - info:
          name: list-exact-routes
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/exact-routes?limit=50'
        docs: List exact routes, keyset-paginated by msisdn (scope admin:read).
      - info:
          name: create-exact-route
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/exact-routes'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "msisdn": "2250700000001",
                "target_type": "connector",
                "target_id": "{{connectorId}}",
                "source": "manual"
              }
        docs: Create/upsert an exact route MSISDN -> connector|route (scope admin:write).
      - info:
          name: import-exact-routes
          type: http
        http:
          method: POST
          url: '{{baseUrl}}/admin/exact-routes/import'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "source": "mnp_import",
                "rows": [
                  { "msisdn": "2250700000001", "target_type": "connector", "target_id": "{{connectorId}}" }
                ]
              }
        docs: Bulk MNP import, async 202 + job_id, idempotent (scope admin:write).
      - info:
          name: lookup-exact-route
          type: http
        http:
          method: GET
          url: '{{baseUrl}}/admin/exact-routes/lookup?msisdn=2250700000001'
        docs: Resolve the exact route for one MSISDN (scope admin:read).
      - info:
          name: update-exact-route
          type: http
        http:
          method: PATCH
          url: '{{baseUrl}}/admin/exact-routes/2250700000001'
          headers:
            - name: Content-Type
