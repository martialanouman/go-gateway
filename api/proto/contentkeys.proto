// ContentKeys is the per-customer content-encryption key custody API (control_plane.content_keys, §6.14,
// M10). It is served by content-key-svc (gRPC :7002, step-167), a DEDICATED service: the KMS master key
// (the KEK that seals every per-customer data key) must live in as few processes as possible, and in one
// whose surface is small enough to audit. It was originally hosted by billing-svc (§14) — see ADR-0011.
//
// It is NOT gated by the billing opt-in: a customer with billing disabled still stores content and
// therefore still needs a content key.
syntax = "proto3";

package contentkeys;

option go_package = "github.com/martialanouman/go-gateway/internal/contentkeys/pb;pb";

// ContentKeys manages the per-customer content-encryption keys. Metadata responses carry key METADATA
// only — never the plaintext data key nor the wrapped bytes; the two RPCs that DO return usable key
// material (GetContentEncryptionKey, GetContentKey) are the guarded encrypt and decrypt paths, ride the
// intra-mesh mTLS, and their data key must never be logged nor persisted.
service ContentKeys {
  // GetOrCreateContentKey returns the customer's active content key, creating one (a fresh data key sealed
  // by the KMS) if none exists yet. Idempotent: concurrent callers converge on a single active key.
  rpc GetOrCreateContentKey(GetOrCreateContentKeyRequest) returns (ContentKeyResponse);
  // RotateContentKey makes a new active key and retires the previous one. The retired key is kept so CDRs
  // written under it stay decryptable — rotation never destroys key material (crypto-shred is separate).
  rpc RotateContentKey(RotateContentKeyRequest) returns (ContentKeyResponse);
  // GetContentEncryptionKey returns the customer's active key id AND its UNWRAPPED (plaintext) data key, so
  // the data plane can encrypt a body at CDR write without the body ever reaching the key service (§14). This is
  // the ONLY RPC that returns plaintext key material: it exists solely for the guarded encrypt path, rides
  // the intra-mesh mTLS, and the DEK must never be logged nor written to a CDR. Callers cache it briefly.
  rpc GetContentEncryptionKey(GetContentEncryptionKeyRequest) returns (ContentEncryptionKeyResponse);
  // GetContentKey unwraps a SPECIFIC content key by id — the guarded DECRYPT path (get-message-content,
  // step-163). A CDR body may be sealed under a retired key (an old row after rotation), so the reader asks by
  // the row's key id, not by the active key. A destroyed (crypto-shredded) key returns destroyed=true and no
  // data key — the content is permanently unreadable. Like GetContentEncryptionKey the plaintext DEK is
  // sensitive: never logged, never persisted.
  rpc GetContentKey(GetContentKeyRequest) returns (GetContentKeyResponse);
  // DestroyContentKeys crypto-shreds ALL of a customer's content keys (erase-customer-content, step-164): each
  // key is marked destroyed and its wrapped data key erased, so every body it sealed becomes permanently
  // unreadable WITHOUT rewriting the CDR. Idempotent. Returns how many keys were destroyed.
  rpc DestroyContentKeys(DestroyContentKeysRequest) returns (DestroyContentKeysResponse);
}

// GetOrCreateContentKeyRequest names the customer whose active key to fetch or create.
message GetOrCreateContentKeyRequest {
  string customer_id = 1;
}

// RotateContentKeyRequest names the customer whose key to rotate.
message RotateContentKeyRequest {
  string customer_id = 1;
}

// ContentKeyResponse is the metadata of a content key. It never carries the plaintext or wrapped data key.
// status is one of active|retired|destroyed; created_at is RFC3339.
message ContentKeyResponse {
  string key_id = 1;
  string customer_id = 2;
  string kms_key_ref = 3;
  string status = 4;
  string created_at = 5;
}

// GetContentEncryptionKeyRequest names the customer whose active data key to fetch (creating one if absent).
message GetContentEncryptionKeyRequest {
  string customer_id = 1;
}

// ContentEncryptionKeyResponse carries the active key id and its plaintext 32-byte data key. The dek is
// SENSITIVE: it must never be logged nor persisted (only the body ciphertext it produces is stored).
message ContentEncryptionKeyResponse {
  string key_id = 1;
  bytes dek = 2;
}

// GetContentKeyRequest names a specific content key by id (the id a CDR row was sealed under).
message GetContentKeyRequest {
  string key_id = 1;
}

// GetContentKeyResponse carries the unwrapped data key, OR reports the key destroyed. dek is the plaintext
// 32-byte data key (empty when destroyed); destroyed=true means the key was crypto-shredded and the content it
// sealed is permanently unreadable. The dek is SENSITIVE: never logged, never persisted.
message GetContentKeyResponse {
  bytes dek = 1;
  bool destroyed = 2;
}

// DestroyContentKeysRequest names the customer whose content keys to crypto-shred.
message DestroyContentKeysRequest {
  string customer_id = 1;
}

// DestroyContentKeysResponse reports how many keys were destroyed (0 when already shredded — idempotent).
message DestroyContentKeysResponse {
  int32 destroyed_count = 1;
}
