// ConfigSecrets seals and opens the control-plane secrets that the gateway REPLAYS to a third party —
// the outbound SMSC bind password (smsc_connectors, §6.8) and the external billing provider's
// credentials (external_billing_providers, §6.10). Those cannot be hashed: an outbound bind puts its
// password in clear in the bind_transceiver PDU (SMPP v3.4 §4.1.1), so the stored form must be
// reversible. The secrets the gateway VERIFIES instead of replaying (credentials.password_hash, the
// API key) stay hashed — see ADR-0016.
//
// It is served by content-key-svc (gRPC :7002) because that service already holds the KMS master key,
// and ADR-0011 wants that key in as few processes as possible. Sealing a password adds no dependency
// to it: still Postgres + gRPC, still no outbound client.
syntax = "proto3";

package configsecrets;

option go_package = "github.com/martialanouman/go-gateway/internal/configsecrets/pb;pb";

// ConfigSecrets is DELIBERATELY not part of ContentKeys, which is customer-scoped and stateful (a key
// store, an active/retired/destroyed lifecycle, crypto-shred). This one is stateless: no store, no
// customer, no rotation. Keeping them apart is what will let a data-plane caller be allowed on
// ConfigSecrets/Open without being allowed on ContentKeys/GetContentEncryptionKey the day it needs its
// bind password from the control plane.
//
// Both RPCs handle plaintext secrets and are served over mutual TLS to the callers this service names
// (step-300b). A plaintext must never be logged nor persisted — only the sealed form is stored.
service ConfigSecrets {
  // Seal encrypts a secret under the KMS master key and returns the form to persist, plus the
  // reference of the key that sealed it. The plaintext is not retained.
  rpc Seal(SealRequest) returns (SealResponse);
  // Open reverses Seal. Tampering, or a different master key, fails cleanly and returns no plaintext.
  rpc Open(OpenRequest) returns (OpenResponse);
}

// SealRequest carries the secret to seal. plaintext is SENSITIVE: never logged, never persisted.
message SealRequest {
  bytes plaintext = 1;
}

// SealResponse carries the bytes to store in the *_sealed column, and the master key reference to store
// alongside them in the *_kms_key_ref column — so an operator can tell which KEK a row belongs to, and a
// future master-key rotation knows what it has to re-seal. It mirrors content_keys.kms_key_ref.
message SealResponse {
  bytes sealed = 1;
  string kms_key_ref = 2;
}

// OpenRequest carries the stored sealed bytes. The key reference is NOT passed: the KMS unwraps with the
// master key it holds, exactly as ContentKeys.GetContentKey does — the stored ref is for operators and
// rotation, not for dispatch.
message OpenRequest {
  bytes sealed = 1;
}

// OpenResponse carries the recovered secret. plaintext is SENSITIVE: never logged, never persisted.
message OpenResponse {
  bytes plaintext = 1;
}
