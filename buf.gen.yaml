# Code generation for api/proto/*.proto (plan §1.7): protos live under api/proto/, generated Go under
# internal/.../pb. Plugins are local binaries installed by `make tools`; regenerate with `make proto`.
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: internal/session/pb
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/session/pb
    opt:
      - paths=source_relative
