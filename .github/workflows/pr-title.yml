# The release workflow derives the version bump from conventional commits. With squash-merge, the PR
# title becomes the commit on main, so validating the title here is what keeps that derivation
# meaningful: a non-conventional title would land as an unversionable commit.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
