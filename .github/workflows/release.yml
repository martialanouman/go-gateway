# Release automation (plan §4). Run BY HAND: derive the next SemVer from the conventional commits
# since the last tag, create and push that tag, then build the binaries, the container images and cut
# a GitHub Release from it. A base carrying no feat/fix (docs, chore, ci only) cuts no release.
#
# Manual on purpose (step-270b). A release is a gesture, not a side effect of merging: it publishes
# twelve container images to a public registry, and that is not something a merge should do on its
# own. One dispatch does the whole thing — tag, archives, images, Release.
#
# Everything runs in one job on purpose: a tag pushed with GITHUB_TOKEN does not trigger another
# workflow, so a separate `on: push: tags` release job would never fire.
name: Release

on:
  workflow_dispatch:

# Never cancel a release that is already publishing; queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create tags and the GitHub Release
  packages: write # push the container images to GHCR (the packages belong to this repository)

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch lets the operator pick any ref in the UI. A release tags, cuts a GitHub
      # Release and pushes twelve public images — from whatever was picked. `on: push: branches:[main]`
      # used to make that structurally impossible; going manual removed the guarantee, so it is stated
      # here instead. A failing step rather than a job-level `if:`, which would skip the job and show a
      # green check for a release that never happened.
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::dispatched from ${{ github.ref }}. A release tags the ref, publishes a GitHub \
          Release and pushes twelve public images to GHCR — run it from main."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version bump and the changelog both need previous tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Compute the next SemVer from the conventional commits since the last tag, then create and push
      # it. default_bump: false means no bump (and so no tag, no release) when nothing versionable
      # landed — a docs/chore/ci-only merge is not a release.
      - name: Compute version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

      # github-tag-action creates the tag through the GitHub API, so it never lands in this runner's
      # clone (checkout ran before the tag existed). GoReleaser validates the release with
      # `git describe --exact-match --tags <tag>` against the local HEAD, which then fails with
      # "git tag <tag> was not made against commit ...". Fetch the freshly created tag onto HEAD so
      # that check passes.
      - name: Fetch the new tag into the local checkout
        if: steps.tag.outputs.new_tag != ''
        run: git fetch --force origin "refs/tags/${{ steps.tag.outputs.new_tag }}:refs/tags/${{ steps.tag.outputs.new_tag }}"

      # buildx with the docker-container driver: the runner's default driver cannot build for more
      # than one platform. QEMU is NOT needed — the Dockerfiles have no RUN, so nothing ever executes
      # under emulation and the second architecture costs a layer extraction.
      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.new_tag != ''

      # Before GoReleaser, not after: dockers_v2 pushes DURING the build, because buildx cannot
      # assemble a multi-arch manifest without pushing it.
      - uses: docker/login-action@v3
        if: steps.tag.outputs.new_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release with GoReleaser
        if: steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build from the tag just created rather than whatever tag git describes at HEAD.
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
