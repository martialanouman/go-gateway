# CI quality gates (plan §4, M0). Every job here mirrors a Makefile target, so a green local
# `make check` means a green pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run obsolete; cancel it rather than pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the linter version identical to the Makefile's, or CI and laptops disagree about style.
  GOLANGCI_VERSION: v2.12.2
  OASDIFF_VERSION: v1.26.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of the Go version; never pin it a second time here.
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        # v9 is the action line that drives golangci-lint v2; v6 only ever spoke v1, and would
        # either reject the version below or install a v1 binary that cannot read a v2 config.
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
      - name: Verify formatting
        run: |
          # gofmt -l lists non-compliant files; the tree must be formatted, not just lintable.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'make tidy' and commit the result."
            exit 1
          fi

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # DIAGNOSTIC (step-250c) — reproduction contrôlée. On n'ajoute QUE la construction de l'image :
      # elle suffit à faire tourner les tests M8, donc à ajouter leurs conteneurs. Ni ciguard ni -p ne
      # sont là, pour qu'un échec accuse cette seule variable.
      - name: Build the SMSC simulator image
        run: make smsc-sim

      - name: Baseline ressources (avant les tests)
        run: |
          echo "=== free -m ==="; free -m
          echo "=== df -h / ==="; df -h /
          echo "=== docker system df ==="; docker system df
          echo "=== nproc ==="; nproc

      - name: go test -race
        run: go test -race -timeout 10m ./...

      # if: always() — on veut la photo même quand la suite est verte, pour disposer d'un point de
      # comparaison. Sans baseline, un chiffre relevé après un échec ne dit rien.
      - name: Ressources après les tests
        if: always()
        run: |
          echo "=== free -m ==="; free -m
          echo "=== df -h / ==="; df -h /
          echo "=== docker system df ==="; docker system df
          echo "=== conteneurs (dont morts) ==="; docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "=== dmesg: OOM / segfault ? ==="
          sudo dmesg | grep -iE "oom|killed process|segfault|general protection|out of memory" | tail -40 || echo "(rien dans dmesg)"
          echo "=== dmesg (queue brute) ==="; sudo dmesg | tail -30

  # Exercises the load harness, NOT the gateway's throughput. It runs the k6 script twice against a
  # local stub — idle (must pass) then slowed past the latency budget (must fail) — so a harness whose
  # thresholds came unwired breaks the build instead of reporting a meaningless green.
  # The sustained (8 000 req/s) and peak (15 000 req/s) profiles never run here: a GitHub runner
  # cannot hold them, and failures there would be noise. They belong on real hardware, in step-201.
  load-smoke:
    name: Load harness (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install k6
        # k6 is a native binary, outside go.mod by plan §1.3 — go install cannot provide it.
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/k6.tar.gz
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum -c -
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo install "/tmp/k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
        env:
          K6_VERSION: 2.1.0
          K6_SHA256: 295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a
      - name: Thresholds must pass idle and fail under load
        run: make load-smoke

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  contracts:
    name: Contracts version gate
    runs-on: ubuntu-latest
    # Rien à comparer sur un push direct : la garde vit sur la PR, là où le bump peut encore être
    # corrigé avant qu'une version parte au registre.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Le script compare HEAD à la branche de base ; il lui faut les refs distantes.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@${{ env.OASDIFF_VERSION }}
      - name: Contract change implies a version bump
        run: scripts/check-contracts.sh
        env:
          BASE_REF: origin/${{ github.base_ref }}

  contracts-types:
    name: Contracts generate TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      # Prouve que les contrats se génèrent en TypeScript valide AVANT publication — sinon la
      # rupture n'apparaîtrait que dans le dépôt du tableau de bord.
      - name: Generate and typecheck
        run: |
          npm ci
          npm run build
          npm run typecheck

  migrate:
    name: Migrations apply and reverse
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 18: the schema needs the native uuidv7() generator.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Proves the acceptance criterion rather than asserting it: the schema applies, and its
      # down migration reverses it cleanly. A down that does not reverse is found here, not
      # during an incident.
      - name: migrate up
        run: go run ./cmd/migrate -dir migrations up
      - name: migrate down
        run: go run ./cmd/migrate -dir migrations down
      - name: migrate up again
        run: go run ./cmd/migrate -dir migrations up
