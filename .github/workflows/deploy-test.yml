# Déploie chaque commit vert de main sur l'environnement de test (deploy/test/README.md). Les images
# portent v0.0.1-sha-<commit> : ni latest, ni Release, ni tag git — Release reste un geste manuel.
name: Deploy test

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit de main à déployer (rollback compris)
        required: true

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: test
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      # $SHA (l'env var, pas ${{ }} dans run:) : un input workflow_dispatch mal formé ne doit jamais
      # s'interpoler tel quel dans un script shell.
      - name: Valider le SHA
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA invalide (attendu 40 caractères hex) : $SHA"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Version de test
        run: echo "VERSION=v0.0.1-sha-${SHA:0:12}" >>"$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      # --snapshot ne pousse pas et suffixe chaque image par sa plateforme : on pousse l'amd64 sous le
      # tag nu, celui que render-manifests.sh substitue.
      - name: Pousser les images
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E "^ghcr.io/martialanouman/go-gateway/[a-z0-9-]+:${VERSION}-amd64$")
          [[ $(wc -l <<<"$images") -eq 12 ]] || { echo "::error::attendu 12 images, obtenu : $images"; exit 1; }
          for img in $images; do
            docker tag "$img" "${img%-amd64}"
            docker push "${img%-amd64}"
          done

      # Hors GoReleaser : internal/deploy/images_test.go refuse une image publiée que deploy/k8s ne
      # déploie pas. Même Dockerfile, même base distroless.
      - name: Image test-env
        run: |
          mkdir -p dist-test/linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist-test/linux/amd64/test-env ./cmd/test-env
          img=ghcr.io/martialanouman/go-gateway/test-env:$VERSION
          docker buildx build --platform linux/amd64 --build-arg BINARY=test-env -t "$img" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --push dist-test -f Dockerfile

      - name: kubeconform
        run: make kubeconform && echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Rendre l'overlay
        run: deploy/test/check.sh "$VERSION"

      - name: Déployer
        env:
          SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.TEST_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "deploy@$HOST" <deploy/test/rendered/all.yaml
