# GoReleaser config (schema v2). Builds the deployable services and cuts a GitHub Release for the
# tag the release workflow creates. Version metadata is stamped into internal/platform/buildinfo via
# -ldflags so every binary reports the release version. fake-smsc is intentionally omitted: it is a
# local test peer, not a deployable. Container images are a later step (see the commented dockers
# block) once the Dockerfiles exist.
version: 2

project_name: go-gateway

before:
  hooks:
    - go mod download

builds:
  - id: rest-api-svc
    main: ./cmd/rest-api-svc
    binary: rest-api-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/martialanouman/go-gateway/internal/platform/buildinfo.Version={{ .Version }}
      - -X github.com/martialanouman/go-gateway/internal/platform/buildinfo.Commit={{ .Commit }}
      - -X github.com/martialanouman/go-gateway/internal/platform/buildinfo.Date={{ .Date }}
  - id: router-svc
    main: ./cmd/router-svc
    binary: router-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: connector-pool-svc
    main: ./cmd/connector-pool-svc
    binary: connector-pool-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: admin-api-svc
    main: ./cmd/admin-api-svc
    binary: admin-api-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: session-manager-svc
    main: ./cmd/session-manager-svc
    binary: session-manager-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: billing-svc
    main: ./cmd/billing-svc
    binary: billing-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: content-key-svc
    main: ./cmd/content-key-svc
    binary: content-key-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: mo-dlr-router-svc
    main: ./cmd/mo-dlr-router-svc
    binary: mo-dlr-router-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: config-sync
    main: ./cmd/config-sync
    binary: config-sync
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: migrate
    main: ./cmd/migrate
    binary: migrate
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: mt-replay
    main: ./cmd/mt-replay
    binary: mt-replay
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  # Operator tool like migrate: topics are infrastructure schema, provisioned by a deliberate act
  # (step-201 D7). step-207's Job has no binary to run without this build.
  - id: kafka-provision
    main: ./cmd/kafka-provision
    binary: kafka-provision
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags

# One archive per service, not one bundle: each cmd/ is deployed independently (its own
# pod/container), so an operator pulls only the service they run. Without a per-build `ids` filter
# GoReleaser packs every binary into a single archive per platform and names it after the first build
# ({{ .Binary }} resolves to router-svc), which reads as "only router-svc was released".
archives:
  - id: rest-api-svc
    ids: [rest-api-svc]
    formats: ["tar.gz"]
    name_template: &archive_name "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: router-svc
    ids: [router-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: connector-pool-svc
    ids: [connector-pool-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: admin-api-svc
    ids: [admin-api-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: session-manager-svc
    ids: [session-manager-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: billing-svc
    ids: [billing-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: mo-dlr-router-svc
    ids: [mo-dlr-router-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: config-sync
    ids: [config-sync]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: migrate
    ids: [migrate]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: mt-replay
    ids: [mt-replay]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: kafka-provision
    ids: [kafka-provision]
    formats: ["tar.gz"]
    name_template: *archive_name

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.*$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.*$'
      order: 1
    - title: Others
      order: 999

release:
  prerelease: auto

# Container images: enable once the service Dockerfiles land (release decision — images come in a
# later step). Each service would get a `dockers:` entry tagged with {{ .Version }}, pushed to GHCR.
# dockers:
#   - image_templates: ["ghcr.io/martialanouman/go-gateway/rest-api-svc:{{ .Version }}"]
#     ...
