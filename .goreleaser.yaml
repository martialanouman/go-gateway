# GoReleaser config (schema v2). Builds the deployable services and cuts a GitHub Release for the
# tag the release workflow creates. Version metadata is stamped into internal/platform/buildinfo via
# -ldflags so every binary reports the release version. fake-smsc is intentionally omitted: it is a
# local test peer, not a deployable. Container images ship from the dockers_v2 block at the
# bottom (step-270b): one per DEPLOYED binary, multi-arch, built from the two Dockerfiles at the root.
version: 2

project_name: go-gateway

before:
  hooks:
    - go mod download

builds:
  - id: rest-api-svc
    main: ./cmd/rest-api-svc
    binary: rest-api-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/martialanouman/go-gateway/internal/platform/buildinfo.Version={{ .Version }}
      - -X github.com/martialanouman/go-gateway/internal/platform/buildinfo.Commit={{ .Commit }}
      - -X github.com/martialanouman/go-gateway/internal/platform/buildinfo.Date={{ .Date }}
  - id: smpp-server-svc
    main: ./cmd/smpp-server-svc
    binary: smpp-server-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: router-svc
    main: ./cmd/router-svc
    binary: router-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: connector-pool-svc
    main: ./cmd/connector-pool-svc
    binary: connector-pool-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: admin-api-svc
    main: ./cmd/admin-api-svc
    binary: admin-api-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: session-manager-svc
    main: ./cmd/session-manager-svc
    binary: session-manager-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: billing-svc
    main: ./cmd/billing-svc
    binary: billing-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: content-key-svc
    main: ./cmd/content-key-svc
    binary: content-key-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: mo-dlr-router-svc
    main: ./cmd/mo-dlr-router-svc
    binary: mo-dlr-router-svc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: config-sync
    main: ./cmd/config-sync
    binary: config-sync
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: migrate
    main: ./cmd/migrate
    binary: migrate
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: mt-replay
    main: ./cmd/mt-replay
    binary: mt-replay
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  # Operator tool like migrate: topics are infrastructure schema, provisioned by a deliberate act
  # (step-201 D7). step-270's Job has no binary to run without this build.
  - id: kafka-provision
    main: ./cmd/kafka-provision
    binary: kafka-provision
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags

# One archive per service, not one bundle: each cmd/ is deployed independently (its own
# pod/container), so an operator pulls only the service they run. Without a per-build `ids` filter
# GoReleaser packs every binary into a single archive per platform and names it after the first build
# ({{ .Binary }} resolves to router-svc), which reads as "only router-svc was released".
archives:
  - id: rest-api-svc
    ids: [rest-api-svc]
    formats: ["tar.gz"]
    name_template: &archive_name "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: smpp-server-svc
    ids: [smpp-server-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: router-svc
    ids: [router-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: connector-pool-svc
    ids: [connector-pool-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: admin-api-svc
    ids: [admin-api-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: session-manager-svc
    ids: [session-manager-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: billing-svc
    ids: [billing-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: content-key-svc
    ids: [content-key-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: mo-dlr-router-svc
    ids: [mo-dlr-router-svc]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: config-sync
    ids: [config-sync]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: migrate
    ids: [migrate]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: mt-replay
    ids: [mt-replay]
    formats: ["tar.gz"]
    name_template: *archive_name
  - id: kafka-provision
    ids: [kafka-provision]
    formats: ["tar.gz"]
    name_template: *archive_name

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.*$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.*$'
      order: 1
    - title: Others
      order: 999

release:
  prerelease: auto

# Container images (step-270b). dockers_v2 builds the multi-arch manifest in ONE `docker buildx build
# --push`, so there is no per-platform entry and no docker_manifests: — twelve entries, twelve tags.
# Platforms default to the goarch of the builds above (amd64 + arm64); these Dockerfiles have no RUN,
# so nothing ever executes under emulation and the second architecture costs a layer extraction.
#
# The tag is {{ .Tag }} (v1.2.3, WITH the v), not {{ .Version }} (1.2.3): deploy/k8s carries the
# :v0.0.0 placeholder and scripts/render-manifests.sh substitutes the published tag verbatim.
#
# One image per DEPLOYED binary. mt-replay is built and archived but no manifest deploys it, so it gets
# no image — an image nobody deploys is attack surface published for free, and it goes stale with
# nothing to report it. internal/deploy holds both directions.
#
# NOTE: images are built in the PUBLISH phase. `goreleaser build` and `release --skip=docker` do not
# build them; `release --snapshot` does, without pushing.
dockers_v2:
  - id: rest-api-svc
    ids: [rest-api-svc]
    images: ["ghcr.io/martialanouman/go-gateway/rest-api-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: rest-api-svc }
    labels: &oci_labels
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
  - id: smpp-server-svc
    ids: [smpp-server-svc]
    images: ["ghcr.io/martialanouman/go-gateway/smpp-server-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: smpp-server-svc }
    labels: *oci_labels
  - id: router-svc
    ids: [router-svc]
    images: ["ghcr.io/martialanouman/go-gateway/router-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: router-svc }
    labels: *oci_labels
  - id: connector-pool-svc
    ids: [connector-pool-svc]
    images: ["ghcr.io/martialanouman/go-gateway/connector-pool-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: connector-pool-svc }
    labels: *oci_labels
  - id: admin-api-svc
    ids: [admin-api-svc]
    images: ["ghcr.io/martialanouman/go-gateway/admin-api-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: admin-api-svc }
    labels: *oci_labels
  - id: session-manager-svc
    ids: [session-manager-svc]
    images: ["ghcr.io/martialanouman/go-gateway/session-manager-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: session-manager-svc }
    labels: *oci_labels
  - id: billing-svc
    ids: [billing-svc]
    images: ["ghcr.io/martialanouman/go-gateway/billing-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: billing-svc }
    labels: *oci_labels
  - id: content-key-svc
    ids: [content-key-svc]
    images: ["ghcr.io/martialanouman/go-gateway/content-key-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: content-key-svc }
    labels: *oci_labels
  - id: mo-dlr-router-svc
    ids: [mo-dlr-router-svc]
    images: ["ghcr.io/martialanouman/go-gateway/mo-dlr-router-svc"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: mo-dlr-router-svc }
    labels: *oci_labels
  - id: config-sync
    ids: [config-sync]
    images: ["ghcr.io/martialanouman/go-gateway/config-sync"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: config-sync }
    labels: *oci_labels
  - id: kafka-provision
    ids: [kafka-provision]
    images: ["ghcr.io/martialanouman/go-gateway/kafka-provision"]
    tags: ["{{ .Tag }}"]
    build_args: { BINARY: kafka-provision }
    labels: *oci_labels
  # The only entry that carries files: cmd/migrate reads the .sql from disk. extra_files stages the
  # directory into the build context; Dockerfile.migrate copies it and pins the WORKDIR the two
  # relative paths resolve against. Either half alone still ships a broken image.
  - id: migrate
    ids: [migrate]
    dockerfile: Dockerfile.migrate
    images: ["ghcr.io/martialanouman/go-gateway/migrate"]
    tags: ["{{ .Tag }}"]
    extra_files: [migrations]
    labels: *oci_labels

